<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niepodległość do zbudowania</title>
<meta name="description" content="Interaktywna lekcja wychowawcza na 11 listopada dla liceum. Ekran projektora z głosowaniem telefonami, symulacją i ściągą dla wychowawcy.">
<link rel="stylesheet" href="fonts/fonty.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f7f3ea'/%3E%3Crect x='6' y='9' width='20' height='7' fill='%23fff' stroke='%23ccc'/%3E%3Crect x='6' y='16' width='20' height='7' fill='%23a3171f'/%3E%3C/svg%3E">
<style>
:root{
  --tlo:#f6f2e9; --papier:#fffdf8; --tusz:#23211e; --szary:#6c665c; --jasny:#9a9385;
  --linia:#e2dacb; --linia2:#d3c9b5; --czerwien:#a3171f; --czerwien2:#c22a32; --czerwienTlo:#f6e4e2;
  --zielen:#2f6b4f; --zielenTlo:#e3efe7; --cien:0 1px 2px rgba(40,30,10,.06),0 6px 22px rgba(40,30,10,.07);
  --serif:"Lora",Georgia,"Times New Roman",serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --u:min(.94vw,1.68vh);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--tlo);color:var(--tusz);font-family:var(--sans);overflow:hidden}
body{font-size:calc(var(--u)*1.6);line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
.ukryj{display:none!important}

/* ---------- górny pasek ---------- */
#gora{position:fixed;top:0;left:0;right:0;height:calc(var(--u)*4.4);display:flex;align-items:center;gap:calc(var(--u)*1.2);padding:0 calc(var(--u)*2);border-bottom:1px solid var(--linia);background:var(--tlo);z-index:5}
#gora .tyt{font-family:var(--serif);font-weight:600;font-size:.95em;white-space:nowrap}
@media (max-width:1900px){#gora .tyt{display:none}}
a{color:var(--czerwien)}
#etapy{display:flex;flex:1;gap:4px;min-width:0}
#etapy button{flex:1;min-width:0;border:0;background:transparent;padding:calc(var(--u)*.4) calc(var(--u)*.6);text-align:left;border-top:3px solid var(--linia);font-size:.72em;color:var(--jasny);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#etapy button b{font-weight:600}
#etapy button.byl{border-top-color:var(--linia2);color:var(--szary)}
#etapy button.teraz{border-top-color:var(--czerwien);color:var(--tusz)}
#etapy button span{color:var(--jasny);font-weight:400;margin-left:.3em}
.chip{display:inline-flex;align-items:center;gap:.45em;border:1px solid var(--linia2);border-radius:999px;padding:.18em .75em;font-size:.72em;background:var(--papier);white-space:nowrap}
.chip .kropka{width:.6em;height:.6em;border-radius:50%;background:var(--jasny)}
.chip.ok .kropka{background:#2f8a5b}.chip.zle .kropka{background:var(--czerwien2)}
#zegar{font-variant-numeric:tabular-nums}

/* ---------- scena ---------- */
#scena{position:absolute;top:calc(var(--u)*4.4);bottom:calc(var(--u)*4.2);left:0;right:0;display:flex;justify-content:center;overflow:auto}
#ekran{width:min(100%,calc(var(--u)*150));padding:calc(var(--u)*2.6) calc(var(--u)*4) calc(var(--u)*2);display:flex;flex-direction:column;min-height:100%}
.ekran-in{animation:wej .35s ease-out}
@keyframes wej{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.etykieta{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--czerwien);font-weight:600;margin-bottom:calc(var(--u)*.8)}
.ekran-tyt{font-size:2.15em;line-height:1.15;margin-bottom:calc(var(--u)*1.6)}
.lead{font-family:var(--serif);font-size:1.5em;line-height:1.4}
.mdl{color:var(--szary)}
.kolumny{display:grid;grid-template-columns:1.25fr 1fr;gap:calc(var(--u)*3);align-items:center;flex:1}
.karta{background:var(--papier);border:1px solid var(--linia);border-radius:10px;box-shadow:var(--cien);padding:calc(var(--u)*1.6) calc(var(--u)*1.8)}
.przyciski{display:flex;gap:calc(var(--u)*.8);flex-wrap:wrap;margin-top:calc(var(--u)*1.4);align-items:center}
.btn{border:1px solid var(--linia2);background:var(--papier);border-radius:8px;padding:.5em 1.05em;font-size:.82em;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--szary)}
.btn.glowny{background:var(--czerwien);border-color:var(--czerwien);color:#fff}
.btn.glowny:hover{background:var(--czerwien2)}
.btn.maly{font-size:.7em;padding:.3em .7em}
.btn[disabled]{opacity:.45;cursor:default}
.wniosek{border-left:4px solid var(--czerwien);background:var(--papier);padding:calc(var(--u)*1.3) calc(var(--u)*1.8);font-family:var(--serif);font-size:1.25em;line-height:1.45;box-shadow:var(--cien);border-radius:0 8px 8px 0}
.wniosek.duzy{font-size:1.75em}
.licznik{font-size:.78em;color:var(--szary)}
.licznik b{color:var(--tusz);font-size:1.25em;font-variant-numeric:tabular-nums}

/* ---------- start ---------- */
.start{display:grid;grid-template-columns:1.1fr 1fr;gap:calc(var(--u)*4);align-items:center;flex:1}
.start h1{font-size:3.7em;line-height:1;letter-spacing:-.02em}
.start h1 em{font-style:italic;font-weight:500;color:var(--czerwien);display:block}
.start .pas{width:calc(var(--u)*9);height:calc(var(--u)*1.1);display:flex;flex-direction:column;margin:calc(var(--u)*1.4) 0;border:1px solid var(--linia2)}
.start .pas i{flex:1;background:#fff}.start .pas i+i{background:var(--czerwien)}
.ustaw{display:flex;flex-direction:column;gap:calc(var(--u)*1)}
.ustaw .karta{padding:calc(var(--u)*1.1) calc(var(--u)*1.4)}
.ustaw h3{font-family:var(--sans);font-size:.7em;letter-spacing:.12em;text-transform:uppercase;color:var(--szary);margin-bottom:.55em;font-weight:600}
.przel{display:flex;gap:.4em;flex-wrap:wrap}
.przel button{border:1px solid var(--linia2);background:var(--tlo);border-radius:7px;padding:.35em .8em;font-size:.8em}
.przel button.wl{background:var(--tusz);color:#fff;border-color:var(--tusz)}
.mini{font-size:.7em;color:var(--szary);margin-top:.45em;line-height:1.4}
.kodsesji{font-family:var(--serif);font-size:1.6em;letter-spacing:.12em;font-weight:600}

/* ---------- QR ---------- */
.qrbox{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.8)}
.qrbox .qr{background:#fff;padding:calc(var(--u)*1.2);border:1px solid var(--linia);border-radius:10px;box-shadow:var(--cien)}
.qrbox .qr svg{display:block;width:calc(var(--u)*22);height:calc(var(--u)*22)}
.qrbox .adres{font-size:.78em;color:var(--szary);text-align:center;word-break:break-all}
.qrbox .adres b{color:var(--tusz);font-size:1.5em;letter-spacing:.1em}

/* ---------- quiz ---------- */
.opcje{display:flex;flex-direction:column;gap:calc(var(--u)*.7)}
.opcja{position:relative;display:grid;grid-template-columns:calc(var(--u)*3) 1fr auto;align-items:center;gap:calc(var(--u)*1);background:var(--papier);border:1px solid var(--linia);border-radius:9px;padding:calc(var(--u)*.85) calc(var(--u)*1.2);overflow:hidden;font-size:1.02em}
.opcja .lit{font-family:var(--serif);font-weight:600;font-size:1.2em;color:var(--czerwien)}
.opcja .pasek{position:absolute;left:0;top:0;bottom:0;background:#efe8da;z-index:0;transition:width .6s ease}
.opcja>*:not(.pasek){position:relative;z-index:1}
.opcja .wyn{font-variant-numeric:tabular-nums;font-weight:600;display:flex;align-items:center;gap:.5em;font-size:.9em}
.opcja.dobra{border-color:var(--zielen);background:var(--zielenTlo)}
.opcja.dobra .pasek{background:#cfe3d6}
.opcja.dobra .lit{color:var(--zielen)}
.opcja.zla{opacity:.6}
.plusminus{display:inline-flex;gap:3px}
.plusminus button{border:1px solid var(--linia2);background:var(--tlo);width:1.6em;height:1.6em;border-radius:5px;font-size:.85em;line-height:1;padding:0}
.wyjasn{margin-top:calc(var(--u)*1.2);background:var(--papier);border:1px solid var(--linia);border-left:4px solid var(--zielen);border-radius:0 8px 8px 0;padding:calc(var(--u)*1) calc(var(--u)*1.4);font-size:.95em}

/* ---------- oś czasu ---------- */
.os{position:relative;margin:calc(var(--u)*2.2) 0 calc(var(--u)*1.4);display:grid;grid-template-columns:repeat(7,1fr)}
.os:before{content:"";position:absolute;left:3%;right:3%;top:calc(var(--u)*1.05);height:2px;background:var(--linia2)}
.punkt{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:.45em;padding:0;position:relative}
.punkt i{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);border-radius:50%;background:var(--papier);border:2px solid var(--linia2);transition:all .2s}
.punkt span{font-size:.82em;font-weight:600;font-variant-numeric:tabular-nums}
.punkt.wid i{border-color:var(--tusz);background:var(--tusz)}
.punkt.akt i{border-color:var(--czerwien);background:var(--czerwien);transform:scale(1.15)}
.punkt.akt span{color:var(--czerwien)}
.punkt.jedenasty span:after{content:"";display:block;height:2px;background:var(--czerwien);margin-top:2px}
.os-opis{min-height:calc(var(--u)*13)}
.os-opis .karta{display:grid;grid-template-columns:auto 1fr;gap:calc(var(--u)*2);align-items:start}
.os-opis .data{font-family:var(--serif);font-size:2.2em;font-weight:600;color:var(--czerwien);line-height:1;white-space:nowrap}
.os-opis .arg{margin-top:.6em;color:var(--szary);font-size:.9em}
.os-opis .arg b{color:var(--tusz);font-weight:600}
.tab-os{width:100%;border-collapse:collapse;font-size:.8em}
.tab-os td{border-top:1px solid var(--linia);padding:.4em .6em;vertical-align:top}
.tab-os td:first-child{font-weight:600;white-space:nowrap;color:var(--czerwien)}

/* ---------- wyniki daty (pionowe słupki) ---------- */
.slupki{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:calc(var(--u)*.8);align-items:end;height:calc(var(--u)*20);margin-top:calc(var(--u)*1)}
.slupek{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:.3em}
.slupek .s{width:70%;background:var(--linia2);border-radius:5px 5px 0 0;transition:height .6s ease;min-height:3px}
.slupek.max .s{background:var(--czerwien)}
.slupek .l{font-weight:700;font-variant-numeric:tabular-nums}
.slupek .d{font-size:.75em;text-align:center;line-height:1.2;color:var(--szary);height:2.5em}
.slupek.jedenasty .d{color:var(--tusz);font-weight:600}

/* ---------- symulacja ---------- */
.kroki{display:flex;flex-direction:column;gap:calc(var(--u)*.8);counter-reset:k}
.krok{display:grid;grid-template-columns:calc(var(--u)*3) 1fr auto;gap:calc(var(--u)*1);align-items:baseline;padding:calc(var(--u)*.7) 0;border-bottom:1px solid var(--linia)}
.krok:before{counter-increment:k;content:counter(k);font-family:var(--serif);font-size:1.4em;color:var(--czerwien);font-weight:600}
.krok .cz{font-size:.8em;color:var(--szary);font-variant-numeric:tabular-nums}
.minutnik{font-family:var(--serif);font-size:6em;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.minutnik.koniec{color:var(--czerwien)}
.zetony{display:flex;gap:.5em;justify-content:center;margin:calc(var(--u)*1) 0}
.zetony i{width:calc(var(--u)*3);height:calc(var(--u)*3);border-radius:50%;background:var(--czerwien);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.siatka{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:4px;font-size:.85em}
.siatka th{font-weight:600;font-size:.82em;color:var(--szary);padding:.3em;text-align:center;line-height:1.2}
.siatka th.gr{width:calc(var(--u)*7);text-align:left;color:var(--tusz);white-space:nowrap}
.siatka td button{width:100%;height:calc(var(--u)*3);border:1px solid var(--linia2);background:var(--papier);border-radius:6px}
.siatka td button.wl{background:var(--czerwien);border-color:var(--czerwien);color:#fff;font-weight:700}
.siatka td.zet{font-variant-numeric:tabular-nums;text-align:center;color:var(--szary);font-size:.85em;white-space:nowrap}
.poziome{display:flex;flex-direction:column;gap:calc(var(--u)*.45)}
.poz{display:grid;grid-template-columns:calc(var(--u)*13) 1fr calc(var(--u)*3);align-items:center;gap:calc(var(--u)*.8);font-size:.85em}
.poz .t{height:calc(var(--u)*1.5);background:var(--tlo);border-radius:4px;overflow:hidden}
.poz .t i{display:block;height:100%;background:var(--tusz);transition:width .5s}
.poz.zero{color:var(--czerwien)}
.poz.zero .n:after{content:" pominięty";font-size:.75em;font-weight:400}
.poz .n{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.odsl{display:grid;grid-template-columns:calc(var(--u)*24) 1fr;gap:calc(var(--u)*2);align-items:start}
.lista7{display:flex;flex-direction:column;gap:calc(var(--u)*.5)}
.k7{display:grid;grid-template-columns:calc(var(--u)*2.4) 1fr auto;align-items:center;gap:.5em;text-align:left;border:1px solid var(--linia);background:var(--papier);border-radius:8px;padding:.45em .8em;font-size:.95em}
.k7 .nr{font-family:var(--serif);font-weight:600;color:var(--jasny);font-size:1.2em}
.k7 .gl{font-size:.72em;color:var(--szary);white-space:nowrap}
.k7.odw .nr{color:var(--czerwien)}
.k7.akt{border-color:var(--tusz);background:var(--tusz);color:#fff}
.k7.akt .nr,.k7.akt .gl{color:#fff}
.szczeg .karta{padding:calc(var(--u)*1.8) calc(var(--u)*2.2)}
.gr7{display:flex;align-items:baseline;gap:.5em}
.gr7 .nr{font-family:var(--serif);font-size:2.4em;color:var(--czerwien);font-weight:600;line-height:1}
.gr7 h3{font-size:1.7em}
.szczeg .pr{color:var(--szary);margin:.5em 0 1em;font-size:.95em}
.dwie{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2);border-top:1px solid var(--linia);padding-top:1em}
.dwie b{font-size:.72em;letter-spacing:.1em;text-transform:uppercase;color:var(--czerwien)}
.dwie p{margin:.4em 0 0;font-size:1em;line-height:1.45}
/* ---------- linia wartości ---------- */
.tezy{display:flex;gap:.4em;flex-wrap:wrap;margin-bottom:calc(var(--u)*1.2)}
.tezy button{border:1px solid var(--linia2);background:var(--papier);border-radius:999px;padding:.25em .75em;font-size:.72em}
.tezy button.wl{background:var(--tusz);color:#fff;border-color:var(--tusz)}
.teza{font-family:var(--serif);font-size:1.9em;line-height:1.3;margin-bottom:calc(var(--u)*2)}
.linia{position:relative;height:calc(var(--u)*16);margin:0 calc(var(--u)*1)}
.linia .os2{position:absolute;left:0;right:0;bottom:calc(var(--u)*3);height:4px;border-radius:2px;background:linear-gradient(90deg,#8a8378,var(--linia2) 50%,var(--czerwien))}
.linia .kr{position:absolute;bottom:calc(var(--u)*3 - var(--u)*.55);width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);margin-left:calc(var(--u)*-.55);border-radius:50%;background:var(--tusz);opacity:.85;transition:left .6s,bottom .6s}
.linia .opis{position:absolute;bottom:0;font-size:.75em;color:var(--szary);font-weight:500}
.linia .opis.p{right:0}
.linia .sr{position:absolute;bottom:calc(var(--u)*3);width:2px;margin-left:-1px;height:calc(var(--u)*12);background:var(--czerwien);opacity:.5}
.linia .sr span{position:absolute;top:-1.4em;left:50%;transform:translateX(-50%);font-size:.65em;white-space:nowrap;color:var(--czerwien);font-weight:600}
.segmenty{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:calc(var(--u)*1)}
.segmenty div{display:flex;flex-direction:column;align-items:center;gap:.3em;font-size:.72em;color:var(--szary);text-align:center}

/* ---------- refleksja ---------- */
.sciana{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.8);align-content:flex-start;min-height:calc(var(--u)*18);padding:calc(var(--u)*.5) 0}
.kart{background:#fffbe9;border:1px solid #eadfb8;padding:.55em .8em;border-radius:3px;box-shadow:0 2px 6px rgba(60,40,0,.08);font-size:.95em;max-width:calc(var(--u)*30);animation:wej .4s ease-out;cursor:pointer;line-height:1.3}
.kart:nth-child(3n){transform:rotate(-1deg)}.kart:nth-child(4n){transform:rotate(1deg)}
.kart.ukr{opacity:.25;text-decoration:line-through}
.chmura{display:flex;flex-wrap:wrap;gap:.25em .9em;justify-content:center;align-items:center;min-height:calc(var(--u)*18);padding:calc(var(--u)*1);font-family:var(--serif)}
.chmura span{line-height:1.1;cursor:pointer}
.zaslona{display:flex;align-items:center;justify-content:center;min-height:calc(var(--u)*18);color:var(--szary);font-size:1em;border:1px dashed var(--linia2);border-radius:10px}
.wpisz{display:flex;gap:.5em;margin-top:calc(var(--u)*.8)}
.wpisz input{flex:1;font:inherit;font-size:.85em;padding:.45em .7em;border:1px solid var(--linia2);border-radius:8px;background:var(--papier)}

/* ---------- moduły ---------- */
.postacie{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*1)}
.postac{border:1px solid var(--linia);background:var(--papier);border-radius:10px;padding:calc(var(--u)*1) calc(var(--u)*1.2);text-align:left;box-shadow:var(--cien)}
.postac h3{font-size:1.05em}
.postac .lata{font-size:.7em;color:var(--szary)}
.postac p{font-size:.75em;margin:.4em 0 0;color:var(--szary)}
.postac.akt{border-color:var(--czerwien);outline:2px solid var(--czerwien)}
.historia{display:flex;flex-direction:column}
.historia div{display:grid;grid-template-columns:calc(var(--u)*12) 1fr;gap:calc(var(--u)*1.5);padding:calc(var(--u)*.9) 0;border-bottom:1px solid var(--linia)}
.historia b{font-family:var(--serif);font-size:1.3em;color:var(--czerwien)}

/* ---------- koniec ---------- */
.koniec{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:calc(var(--u)*2.4)}
.koniec .zd{font-family:var(--serif);font-size:2.3em;line-height:1.35;max-width:24em}
.koniec .daty{font-size:.95em;letter-spacing:.22em;text-transform:uppercase;color:var(--szary)}
.koniec .pas2{width:calc(var(--u)*12);height:calc(var(--u)*1.4);display:flex;flex-direction:column;border:1px solid var(--linia2)}
.koniec .pas2 i{flex:1;background:#fff}.koniec .pas2 i+i{background:var(--czerwien)}

/* ---------- dolny pasek ---------- */
#dol{position:fixed;bottom:0;left:0;right:0;height:calc(var(--u)*4.2);display:flex;align-items:center;gap:calc(var(--u)*1);padding:0 calc(var(--u)*2);border-top:1px solid var(--linia);background:var(--tlo);z-index:5}
#dol .btn{font-size:.72em}
#nr{font-size:.72em;color:var(--szary);font-variant-numeric:tabular-nums;margin:0 .4em}
.odstep{flex:1}
kbd{font-family:var(--sans);font-size:.85em;border:1px solid var(--linia2);border-bottom-width:2px;border-radius:4px;padding:0 .35em;background:var(--papier)}

/* ---------- panel nauczyciela ---------- */
#panel{position:fixed;top:calc(var(--u)*4.4);bottom:calc(var(--u)*4.2);right:0;width:min(34vw,560px);background:#2a2724;color:#efe9de;z-index:6;transform:translateX(102%);transition:transform .3s ease;overflow:auto;padding:calc(var(--u)*1.6);font-size:.82em;box-shadow:-10px 0 30px rgba(0,0,0,.18)}
#panel.otw{transform:none}
#panel h2{font-size:1.25em;color:#fff;margin-bottom:.2em}
#panel h4{font-size:.72em;letter-spacing:.12em;text-transform:uppercase;color:#d9a19c;margin:1.2em 0 .4em}
#panel ul{margin:0;padding-left:1.1em}
#panel li{margin:.25em 0}
#panel .pow{background:rgba(255,255,255,.06);border-left:3px solid #d9a19c;padding:.5em .8em;margin:.35em 0;font-family:var(--serif);font-style:italic}
#panel .btn{background:transparent;color:#efe9de;border-color:#5b554d}
#panel .tmr{display:flex;align-items:center;gap:.6em;background:rgba(255,255,255,.06);border-radius:8px;padding:.6em .8em;margin-top:.6em}
#panel .tmr .t{font-family:var(--serif);font-size:1.8em;font-variant-numeric:tabular-nums;min-width:3.2em}
#panel .tmr.koniec .t{color:#ff8a80}
#panel .czas{color:#bdb5a8}
#panel details{border-top:1px solid #45403a;padding:.45em 0}
#panel summary{cursor:pointer;font-weight:600}
#panel details p{margin:.4em 0 .2em;color:#d8d1c4}

/* ---------- nakładki ---------- */
.nakladka{position:fixed;inset:0;background:rgba(246,242,233,.97);z-index:10;display:flex;align-items:center;justify-content:center;padding:calc(var(--u)*3)}
.nakladka .zamk{position:absolute;top:calc(var(--u)*1.5);right:calc(var(--u)*2)}
.nakladka .qrbox .qr svg{width:min(60vh,calc(var(--u)*40));height:min(60vh,calc(var(--u)*40))}
.trudne{max-width:calc(var(--u)*110);width:100%;max-height:100%;overflow:auto}
.trudne details{border-bottom:1px solid var(--linia);padding:calc(var(--u)*.8) 0}
.trudne summary{cursor:pointer;font-family:var(--serif);font-size:1.15em;font-weight:600}
.trudne p{margin:.6em 0 .2em;font-size:.95em}
#toast{position:fixed;left:50%;bottom:calc(var(--u)*5.5);transform:translateX(-50%);background:var(--tusz);color:#fff;padding:.5em 1em;border-radius:8px;font-size:.75em;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.wid{opacity:1}
@media (max-aspect-ratio:4/3){.kolumny,.start{grid-template-columns:1fr}.odsl,.dwie{grid-template-columns:1fr}.postacie{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header id="gora">
  <div class="tyt">Niepodległość do zbudowania</div>
  <nav id="etapy"></nav>
  <span class="chip" id="polacz"><span class="kropka"></span><span id="polaczTxt">tryb ręczny</span></span>
  <span class="chip" title="Czas od rozpoczęcia lekcji"><span id="zegar">0:00</span></span>
</header>
<main id="scena"><div id="ekran"></div></main>
<footer id="dol">
  <button class="btn" id="wstecz" title="Poprzedni ekran (←)">← Wstecz</button>
  <span id="nr"></span>
  <button class="btn glowny" id="dalej" title="Następny ekran (→ lub spacja)">Dalej →</button>
  <span class="odstep"></span>
  <button class="btn" data-akcja="qr" title="Kod QR dla spóźnionych (Q)">Kod QR <kbd>Q</kbd></button>
  <button class="btn" data-akcja="trudne" title="Trudne pytania uczniów (T)">Trudne pytania <kbd>T</kbd></button>
  <button class="btn" data-akcja="panel" title="Ściąga dla wychowawcy (N)">Ściąga <kbd>N</kbd></button>
  <button class="btn" data-akcja="pelny" title="Pełny ekran (F)"><kbd>F</kbd></button>
</footer>
<aside id="panel" aria-label="Ściąga dla wychowawcy"></aside>
<div id="nakladka" class="nakladka ukryj"></div>
<div id="toast"></div>

<script src="tresc.js"></script>
<script src="ustawienia.js"></script>
<script src="qrcode.js"></script>
<script>
(function(){
"use strict";
var T = window.TRESC, U = window.USTAWIENIA || {};
var ADRES = (U.ADRES || "").trim();
var KLUCZ = "ndz-stan-v1";
var LITERY = "ABCDEFGH";

/* ================= stan ================= */
function nowyKod(){ var a="ABCDEFGHJKLMNPRSTUWXYZ23456789", s=""; for(var i=0;i<5;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
function nowyTok(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function domyslny(){
  var d=new Date(); var przed = (d.getMonth()<10) || (d.getMonth()===10 && d.getDate()<11);
  return { wariant: przed?"przed":"po", modA:false, modB:false, reczny: !ADRES, kod:nowyKod(), tok:nowyTok(),
    idx:0, start:0, odsl:{}, man:{}, grupy:{n:5, wyb:[]}, odwr:{}, teza:0, ref:0, karta:-1, notatki:[], ukryte:{}, widok:"sciana", zaslona:false, os:-1, osWid:{}, postac:-1 };
}
var S;
try { S = JSON.parse(localStorage.getItem(KLUCZ)) || domyslny(); } catch(e){ S = domyslny(); }
var D = domyslny(); for (var k in D) if (!(k in S)) S[k]=D[k];
if (!ADRES) S.reczny = true;
function zapisz(){ try{ localStorage.setItem(KLUCZ, JSON.stringify(S)); }catch(e){} }

/* ================= pomocnicze ================= */
function $(s,r){ return (r||document).querySelector(s); }
function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function toast(t){ var e=$("#toast"); e.textContent=t; e.classList.add("wid"); clearTimeout(toast.t); toast.t=setTimeout(function(){e.classList.remove("wid");},2200); }
function mmss(ms){ ms=Math.max(0,Math.round(ms/1000)); return Math.floor(ms/60)+":"+("0"+ms%60).slice(-2); }
var WULG = /(k+u+r+w|ch+u+j|\bh+u+j|p+i+e+r+d+o+l|\bj+e+b|zaj+e+b|wyj+e+b|p+i+z+d|k+u+t+a+s|d+z+i+w+k|sk+u+r+w|sp+i+e+r+d|c+i+p+a|f+u+c+k|sh+i+t)\w*/gi;
function czysc(t){ return String(t).replace(WULG, function(w){ return w[0]+"•••"; }); }
function norm(x){ return String(x).toLowerCase().replace(/[.,!?;:"„”…]+/g,"").replace(/\s+/g," ").trim(); }
function wariant(){ return T.warianty[S.wariant] || T.warianty.przed; }

/* ================= adres strony uczniów ================= */
function bazowy(){
  if (/^https?:/.test(location.protocol)) return location.href.replace(/[#?].*$/,"").replace(/[^\/]*$/,"");
  return (U.STRONA||"").replace(/\/?$/,"/");
}
function adresUcznia(){ return bazowy()+"glos.html?s="+S.kod; }
function qrSvg(tekst){
  var q=qrcode(0,"M"); q.addData(tekst); q.make();
  var n=q.getModuleCount(), m=2, p="";
  for(var r=0;r<n;r++) for(var c=0;c<n;c++) if(q.isDark(r,c)) p+="M"+(c+m)+" "+(r+m)+"h1v1h-1z";
  return '<svg viewBox="0 0 '+(n+2*m)+' '+(n+2*m)+'" shape-rendering="crispEdges"><path d="'+p+'" fill="#23211e"/></svg>';
}
function blokQR(){
  return '<div class="qrbox"><div class="qr">'+qrSvg(adresUcznia())+'</div><div class="adres">'+esc(adresUcznia().replace(/^https?:\/\//,"").replace(/glos\.html\?s=.*/,"glos.html"))+'<br>kod klasy: <b>'+S.kod+'</b></div></div>';
}

/* ================= łączność z zapleczem ================= */
var NA_ZYWO = function(){ return !!ADRES && !S.reczny; };
var R = {};              // wyniki z telefonów: {qid:{n, v:[]}}
var ostatniCur = null, stanPol = "brak";
function ustawPol(s){ stanPol=s; var e=$("#polacz"); e.classList.toggle("ok", s==="ok"); e.classList.toggle("zle", s==="blad");
  $("#polaczTxt").textContent = !NA_ZYWO() ? "tryb ręczny" : s==="ok" ? "telefony: kod "+S.kod : s==="blad" ? "brak połączenia" : "łączenie…"; }
function post(obj){
  obj.s=S.kod; obj.tok=S.tok;
  return fetch(ADRES,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj)})
    .then(function(r){return r.json();}).then(function(j){ if(j.ok) ustawPol("ok"); else if(j.blad==="token"){ toast("Ten kod klasy jest zajęty. Kliknij „Nowa klasa” na ekranie startowym."); ustawPol("blad"); } return j; })
    .catch(function(){ ustawPol("blad"); });
}
function ustawCur(p){
  if (!NA_ZYWO()) return;
  var klucz = JSON.stringify(p);
  if (klucz === ostatniCur) return;
  ostatniCur = klucz;
  post({akcja:"pytanie", p:p}).then(function(j){ if(!j||!j.ok) ostatniCur=null; });
}
function pobierz(qid){
  if (!NA_ZYWO() || !qid) return;
  fetch(ADRES+"?co=wyniki&s="+S.kod+"&q="+encodeURIComponent(qid)).then(function(r){return r.json();}).then(function(j){
    if(!j.ok) return; ustawPol("ok");
    var stare = JSON.stringify(R[qid]); R[qid]={n:j.n, v:j.v};
    if (stare !== JSON.stringify(R[qid])) odswiez();
  }).catch(function(){ ustawPol("blad"); });
}
setInterval(function(){ var e=EKR[S.idx]; if(e && e.q && document.visibilityState==="visible") pobierz(e.q()); }, 2500);
setInterval(function(){ if(NA_ZYWO()) ostatniCur=null, ustawCur(curDla(EKR[S.idx])); }, 30000); // odświeżenie, gdyby pamięć wygasła

/* liczenie głosów: telefony + ręczne */
function liczby(qid, n){
  var a=[]; for(var i=0;i<n;i++) a[i]=0;
  var m=S.man[qid]||[]; for(i=0;i<n;i++) a[i]+= (m[i]||0);
  if (NA_ZYWO() && R[qid]) R[qid].v.forEach(function(v){ if(v>=0&&v<n) a[v]++; });
  return a;
}
function plus(qid,i,d,n){ var m=S.man[qid]||(S.man[qid]=[]); for(var j=0;j<n;j++) m[j]=m[j]||0; m[i]=Math.max(0,m[i]+d); zapisz(); odswiez(); }
function pokazPM(){ return S.reczny || $("#panel").classList.contains("otw"); }

/* ================= minutniki ================= */
var MIN = {}; // nazwa -> {dur, end, left, run, dzwonek}
function minStart(n,dur){ var m=MIN[n]; if(!m||dur){ m=MIN[n]={dur:dur||m.dur,left:dur||m.dur,run:false,dz:false}; } if(m.left<=0) m.left=m.dur, m.dz=false; m.end=Date.now()+m.left; m.run=true; tik(); }
function minPauza(n){ var m=MIN[n]; if(!m) return; if(m.run){ m.left=m.end-Date.now(); m.run=false; } tik(); }
function minReset(n,dur){ MIN[n]={dur:dur,left:dur,run:false,dz:false}; tik(); }
function minPoz(n){ var m=MIN[n]; if(!m) return 0; return m.run? m.end-Date.now() : m.left; }
function dzwonek(){
  try{ var c=new (window.AudioContext||window.webkitAudioContext)(); [660,880,660].forEach(function(f,i){ var o=c.createOscillator(), g=c.createGain(); o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(c.destination); var t=c.currentTime+i*.35; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.18,t+.04); g.gain.exponentialRampToValueAtTime(.001,t+.9); o.start(t); o.stop(t+1); }); }catch(e){}
}
function tik(){
  for (var n in MIN){ var m=MIN[n]; if(m.run && m.end-Date.now()<=0){ m.run=false; m.left=0; if(!m.dz){ m.dz=true; dzwonek(); toast("Koniec czasu"); } } }
  document.querySelectorAll("[data-min]").forEach(function(el){ var n=el.getAttribute("data-min"); el.textContent=mmss(minPoz(n)); var k=MIN[n]&&MIN[n].left<=0&&!MIN[n].run; el.closest(".tmr,.minutnik") && el.closest(".tmr,.minutnik").classList.toggle("koniec", !!k); if(el.classList.contains("minutnik")) el.classList.toggle("koniec",!!k); });
  document.querySelectorAll("[data-minbtn]").forEach(function(b){ var m=MIN[b.getAttribute("data-minbtn")]; b.textContent = m&&m.run ? "Pauza" : "Start"; });
  $("#zegar").textContent = S.start ? mmss(Date.now()-S.start) : "0:00";
}
setInterval(tik, 500);

/* ================= etapy ================= */
var ETAPY = [
  {id:"s", nazwa:"Start", min:0},
  {id:"1", nazwa:"1. Wejście", min:5},
  {id:"2", nazwa:"2. Śledztwo", min:8},
  {id:"3", nazwa:"3. Państwo od zera", min:20},
  {id:"4", nazwa:"4. Zamknięcie", min:10},
  {id:"p", nazwa:"Puenta", min:2},
  {id:"m", nazwa:"Moduł A", min:20}
];

/* ================= ekrany ================= */
function quiz(qid, P, etap, nrPyt){
  return {
    id:qid, etap:etap, q:function(){return qid;},
    sciaga: nrPyt===1 ? {czas:"2 min", powiedz:["Zacznijmy od szybkiego sprawdzianu, bez ocen. Co właściwie wydarzyło się 11 listopada 1918 roku? Głosujcie na telefonach."],
        oczekuj:["Poczekaj, aż licznik głosów przestanie rosnąć (zwykle 30–60 s). Kliknij „Pokaż wyniki”, a potem „Pokaż odpowiedź”."], uwagi:[]}
      : {czas:"2 min", powiedz:["Drugie pytanie: ile walut było w obiegu na ziemiach polskich pod koniec 1918 roku?"],
        oczekuj:["Większość zgaduje „jedną” albo „dwie”. Po odsłonie przeczytaj zdanie przejścia z ekranu."], uwagi:[]},
    cur:function(){ return {id:qid, typ:"wybor", tresc:P.tresc, opcje:P.opcje}; },
    html:function(){
      return '<div class="etykieta">Etap 1 · Pytanie '+nrPyt+' z 2</div><h2 class="ekran-tyt">'+esc(P.tresc)+'</h2><div id="dyn"></div>';
    },
    dyn:function(){
      var o=S.odsl[qid]||0, n=P.opcje.length, l=liczby(qid,n), suma=l.reduce(function(a,b){return a+b;},0), mx=Math.max.apply(null,l.concat([1]));
      var h='<div class="opcje">';
      P.opcje.forEach(function(t,i){
        var kl = o>=2 ? (i===P.poprawna?" dobra":" zla") : "";
        h+='<div class="opcja'+kl+'"><div class="pasek" style="width:'+(o>=1? (l[i]/Math.max(suma,1)*100):0)+'%"></div><span class="lit">'+LITERY[i]+'</span><span>'+esc(t)+'</span><span class="wyn">'+
          (o>=1? l[i]+' <span class="mdl" style="font-weight:400">('+Math.round(l[i]/Math.max(suma,1)*100)+'%)</span>':'')+
          (pokazPM()? '<span class="plusminus"><button data-plus="'+qid+'|'+i+'|-1|'+n+'">−</button><button data-plus="'+qid+'|'+i+'|1|'+n+'">+</button></span>':'')+'</span></div>';
      });
      h+='</div><div class="przyciski"><span class="licznik">Głosów: <b>'+suma+'</b></span><span class="odstep"></span>'+
        (o<1?'<button class="btn" data-odsl="'+qid+'|1">Pokaż wyniki</button>':'')+
        (o<2?'<button class="btn glowny" data-odsl="'+qid+'|2">Pokaż odpowiedź</button>':'<button class="btn maly" data-reset="'+qid+'">Wyczyść głosy</button>')+'</div>';
      if (o>=2){ h+='<div class="wyjasn">'+esc(P.wyjasnienie)+'</div>'; if(P.przejscie) h+='<div class="wniosek" style="margin-top:1em">„'+esc(P.przejscie)+'”</div>'; }
      return h;
    }
  };
}

var EKR_WSZ = [
  { id:"start", etap:"s", cur:function(){return {id:"czekaj0",typ:"czekaj",tresc:"Lekcja zaraz się zacznie."};},
    html:function(){
      var w=S.wariant;
      return '<div class="start"><div><div class="etykieta">Lekcja wychowawcza · 11 listopada</div><h1>Niepodległość<em>do zbudowania</em></h1><div class="pas"><i></i><i></i></div>'+
        '<p class="lead mdl" style="font-size:1.05em;max-width:28em">'+esc(T.podtytul)+'. Klasy I–IV liceum, 45 minut. Prowadzi wychowawca, aplikacja niesie treść.</p>'+
        '<div class="przyciski"><button class="btn glowny" data-akcja="zacznij" style="font-size:1em">Rozpocznij lekcję →</button>'+
        '<a class="btn" href="druk.html" target="_blank" style="text-decoration:none">Materiały do druku</a>'+
        '<a class="btn" href="druk.html#instrukcja" target="_blank" style="text-decoration:none">Instrukcja w 5 minut</a></div></div>'+
        '<div class="ustaw">'+
          '<div class="karta"><h3>Termin lekcji</h3><div class="przel"><button data-wariant="przed" class="'+(w==="przed"?"wl":"")+'">Przed 11 listopada</button><button data-wariant="po" class="'+(w==="po"?"wl":"")+'">Po 11 listopada</button></div><div class="mini">Zmienia zdanie otwierające i zamykające lekcję.</div></div>'+
          '<div class="karta"><h3>Moduły dodatkowe (poza 45 minutami)</h3><div class="przel"><button data-mod="modB" class="'+(S.modB?"wl":"")+'">B · Historia samego święta (5 min)</button><button data-mod="modA" class="'+(S.modA?"wl":"")+'">A · Wiele twarzy niepodległości</button></div><div class="mini">Moduł B pojawi się po etapie 2, moduł A na końcu (na drugą godzinę).</div></div>'+
          '<div class="karta"><h3>Głosowanie</h3>'+(ADRES?
            '<div class="przel"><button data-tryb="tel" class="'+(!S.reczny?"wl":"")+'">Telefony (kod QR)</button><button data-tryb="rek" class="'+(S.reczny?"wl":"")+'">Tylko ręcznie</button></div>'+
            '<div class="mini">'+(!S.reczny?'Kod tej klasy: <span class="kodsesji">'+S.kod+'</span> · <a href="#" data-akcja="nowa">Nowa klasa</a> (czyści wyniki)':'Wychowawca wpisuje liczby głosów przyciskami + i −. Lekcja działa bez internetu.')+'</div>'
            :'<div class="mini">Tryb ręczny: wychowawca wpisuje liczby głosów przyciskami + i −. Aby włączyć głosowanie telefonami, wpisz adres zaplecza w pliku <code>ustawienia.js</code> (instrukcja w <code>Kod.gs</code>). <a href="#" data-akcja="nowa">Wyczyść wyniki</a></div>')+
          '</div>'+
          '<div class="karta"><h3>Sterowanie</h3><div class="mini" style="margin:0"><kbd>→</kbd> <kbd>spacja</kbd> dalej · <kbd>←</kbd> wstecz · <kbd>N</kbd> ściąga dla wychowawcy · <kbd>T</kbd> trudne pytania · <kbd>Q</kbd> kod QR · <kbd>F</kbd> pełny ekran</div></div>'+
        '</div></div>';
    },
    sciaga:{czas:"przed lekcją", powiedz:[], oczekuj:[], uwagi:[
      "Wybierz termin (przed czy po święcie). Aplikacja ustawia go sama według daty, ale możesz zmienić.",
      "Rozdaj każdej grupie komplet 7 kart problemów i kartę notatek (druk.html). Przygotuj 4–6 grup.",
      "Jeśli działa głosowanie telefonami, każda klasa ma osobny kod. Przed lekcją w nowej klasie kliknij „Nowa klasa”.",
      "Klawisz N otwiera tę ściągę na każdym ekranie. Uczniowie widzą ją, jeśli ekran laptopa jest powielony na projektorze, więc zerkaj krótko lub ustaw projektor jako rozszerzenie pulpitu."]}
  },
  { id:"wejscie", etap:"1",
    cur:function(){return {id:"czekaj1",typ:"czekaj",tresc:"Jesteś połączony. Za chwilę pierwsze pytanie."};},
    html:function(){
      var tel=NA_ZYWO();
      return '<div class="etykieta">Etap 1 · Wejście</div><div class="kolumny"><div><p class="lead">„'+esc(wariant().otwarcie)+'”</p>'+
        (tel?'<p class="mdl" style="margin-top:1.4em">Zeskanujcie kod telefonem. Pytania będą pojawiać się same, nie trzeba niczego instalować ani się logować. Głosowanie jest anonimowe.</p>'
            :'<p class="mdl" style="margin-top:1.4em">Za chwilę dwa szybkie pytania. Zagłosujcie, podnosząc rękę przy wybranej odpowiedzi.</p>')+
        '</div>'+(tel? blokQR() : '<div class="wniosek" style="font-size:1.4em">Co właściwie wydarzyło się<br>11 listopada 1918 roku?</div>')+'</div>';
    },
    sciaga:{czas:"1 min", powiedz:[wariantOtw], oczekuj:["Uczniowie skanują kod. Spóźnionym pokaż kod klawiszem Q w dowolnym momencie."], uwagi:["Bez telefonów: głosowanie przez podniesienie rąk, liczby wpisujesz przyciskami + i −."]}
  },
  quiz("p1", T.pytanie1, "1", 1),
  quiz("p2", T.pytanie2, "1", 2),
  { id:"os", etap:"2", cur:function(){return {id:"czekaj2",typ:"czekaj",tresc:"Patrz na ekran: oś wydarzeń jesieni 1918."};},
    html:function(){ return '<div class="etykieta">Etap 2 · Śledztwo „Dlaczego 11 listopada?”</div><h2 class="ekran-tyt">Jesień 1918: siedem dat, jedna niepodległość</h2><div id="dyn"></div>'; },
    dyn:function(){
      var h='<div class="os">';
      T.os.forEach(function(p,i){ h+='<button class="punkt'+(S.osWid[i]?" wid":"")+(S.os===i?" akt":"")+(i===3?" jedenasty":"")+'" data-os="'+i+'"><i></i><span>'+esc(p.data)+'</span></button>'; });
      h+='</div><div class="os-opis">';
      if (S.os>=0){ var p=T.os[S.os]; h+='<div class="karta ekran-in"><div class="data">'+esc(p.data.replace(" 1918",""))+'</div><div><div style="font-size:1.15em">'+esc(p.wyd)+'</div><div class="arg"><b>Argument „za tą datą”:</b> '+esc(p.arg)+'</div></div></div>'; }
      else h+='<p class="mdl" style="text-align:center;margin-top:2em">Klikaj kolejne punkty osi (albo naciskaj →).</p>';
      h+='</div>';

      if(S.postac>=0){ var p=T.postacie[S.postac]; h+='<div class="karta ekran-in" style="margin-top:1em"><h3 style="font-size:1.2em">'+esc(p.imie)+' <span class="mdl" style="font-family:var(--sans);font-size:.65em;font-weight:400">'+esc(p.lata)+'</span></h3><p style="margin:.5em 0;font-size:.92em">'+esc(p.bio)+'</p><p class="mdl" style="margin:0;font-size:.85em"><b style="color:var(--czerwien)">Pytanie dla grupy:</b> '+esc(p.pytanie)+'</p></div>'; }
      return h;
    },
    sciaga:{czas:"15–20 min (na drugą godzinę lub zamiast etapu 2)", powiedz:["Każda grupa dostaje jedną postać. Przeczytajcie biogram i odpowiedzcie: kim był(a), jakie miał(a) poglądy, jak przyczynił(a) się do niepodległości, z kim się spierał(a)."],
      oczekuj:["Grupy prezentują postać w 1 minutę. Na koniec pytanie: co ich różniło, a co mimo to połączyło?","Odpowiedź, do której warto dojść: różnili się prawie we wszystkim, ale łączyło ich to, że chcieli niepodległego państwa i dla niego pracowali."],
      uwagi:["Biogramy do druku są w materiałach (druk.html).","Kliknięcie postaci pokazuje jej biogram na ekranie."]}
  }
];
function wariantOtw(){ return "„"+wariant().otwarcie+"”"; }
function wariantZam(){ return "„"+wariant().zamkniecie+"”"; }

var EKR = [];
function zbuduj(){ EKR = EKR_WSZ.filter(function(e){ return !e.modul || S[e.modul]; }); if(S.idx>=EKR.length) S.idx=EKR.length-1; }
function liczGr(){ var l=T.karty.map(function(){return 0;}); S.grupy.wyb.slice(0,S.grupy.n).forEach(function(a){ a.forEach(function(i){ l[i]++; }); }); return l; }
function wartLinii(qid){
  var v=[]; var m=S.man[qid]||[]; [10,30,50,70,90].forEach(function(p,i){ for(var j=0;j<(m[i]||0);j++) v.push(p); });
  if(NA_ZYWO() && R[qid]) v=v.concat(R[qid].v.map(Number)); return v;
}
function tekstyRef(qid){
  var t=S.notatki.filter(function(n){return n.q===qid;}).map(function(n){return n.t;});
  if(NA_ZYWO() && R[qid]) t=t.concat(R[qid].v.map(String)); return t;
}
function curDla(e){ return e && e.cur ? e.cur() : {id:"czekaj",typ:"czekaj",tresc:"Patrz na ekran."}; }

/* ================= rysowanie ================= */
function rysuj(){
  zbuduj();
  var e=EKR[S.idx], el=$("#ekran");
  el.innerHTML=e.html(); el.classList.remove("ekran-in"); void el.offsetWidth; el.classList.add("ekran-in");
  odswiez(true);
  if(e.enter) e.enter();
  // pasek etapów
  var tu=e.etap, ix=ETAPY.findIndex(function(x){return x.id===tu;});
  $("#etapy").innerHTML=ETAPY.filter(function(x){ return x.id!=="m" || S.modA; }).map(function(x,i){
    var j=ETAPY.indexOf(x);
    return '<button class="'+(x.id===tu?"teraz":j<ix?"byl":"")+'" data-etap="'+x.id+'"><b>'+esc(x.nazwa)+'</b>'+(x.min?'<span>'+x.min+'′</span>':'')+'</button>';
  }).join("");
  $("#nr").textContent=(S.idx+1)+" / "+EKR.length;
  $("#wstecz").disabled = S.idx===0; $("#dalej").disabled = S.idx===EKR.length-1;
  $("#scena").scrollTop=0;
  rysujPanel();
  ustawCur(curDla(e));
  ustawPol(stanPol);
  var q=e.q&&e.q(); if(q) pobierz(q);
  tik();
}
function odswiez(){
  var e=EKR[S.idx], d=$("#dyn"); if(d && e.dyn) d.innerHTML=e.dyn();
}
function rysujPanel(){
  var e=EKR[S.idx], s=e.sciaga||{}, et=ETAPY.find(function(x){return x.id===e.etap;});
  function lista(a){ return (a||[]).map(function(x){ return '<li>'+esc(typeof x==="function"?x():x)+'</li>'; }).join(""); }
  var h='<h2>'+esc(et.nazwa)+'</h2><div class="czas">Ten ekran: '+esc(s.czas||"")+(et.min?' · cały etap: '+et.min+' min':'')+'</div>';
  if(et.min){ var n="etap"+et.id; if(!MIN[n]) minReset(n, et.min*60000);
    h+='<div class="tmr"><span class="t" data-min="'+n+'">'+mmss(minPoz(n))+'</span><button class="btn maly" data-minbtn="'+n+'">Start</button><button class="btn maly" data-minreset="'+n+'|'+et.min+'">Od nowa</button></div>'; }
  if(s.powiedz&&s.powiedz.length) h+='<h4>Co powiedzieć</h4>'+s.powiedz.map(function(x){ return '<div class="pow">'+esc(typeof x==="function"?x():x)+'</div>'; }).join("");
  if(s.oczekuj&&s.oczekuj.length) h+='<h4>Czego się spodziewać</h4><ul>'+lista(s.oczekuj)+'</ul>';
  if(s.uwagi&&s.uwagi.length) h+='<h4>Wskazówki</h4><ul>'+lista(s.uwagi)+'</ul>';
  if(e.id==="p1"||e.id==="p2"){ var P=e.id==="p1"?T.pytanie1:T.pytanie2; h+='<h4>Ściąga merytoryczna</h4><ul>'+lista(P.sciaga)+'</ul>'; }
  if(e.id==="refleksja" && NA_ZYWO()){ var t=tekstyRef("ref"+S.ref); h+='<h4>Odpowiedzi (podgląd tylko dla ciebie)</h4><ul>'+t.map(function(x){return '<li>'+esc(czysc(x))+'</li>';}).join("")+'</ul>'; }
  h+='<h4>Trudne pytania uczniów</h4>'+T.trudne.map(function(x){ return '<details><summary>'+esc(x.p)+'</summary><p>'+esc(x.o)+'</p></details>'; }).join("");
  h+='<p style="margin-top:1.4em;color:#9c9488;font-size:.85em">Przy otwartej ściądze widać przyciski + i − do ręcznego dopisywania głosów (np. uczniów bez telefonu).</p>';
  $("#panel").innerHTML=h; tik();
}

/* ================= nawigacja ================= */
function idz(i){ if(i<0||i>=EKR.length) return; S.idx=i; zapisz(); rysuj(); }
function dalej(){ var e=EKR[S.idx]; if(!S.start && S.idx===0){ S.start=Date.now(); } if(e.dalej && e.dalej()) return; idz(S.idx+1); }
function wstecz(){ idz(S.idx-1); }
function nakladka(html){ var n=$("#nakladka"); n.innerHTML='<button class="btn zamk" data-akcja="zamknij">Zamknij <kbd>Esc</kbd></button>'+html; n.classList.remove("ukryj"); }
function zamknijNak(){ $("#nakladka").classList.add("ukryj"); }
function pokazQR(){ if(!NA_ZYWO()){ toast("Głosowanie telefonami jest wyłączone (tryb ręczny)."); return; } nakladka('<div style="text-align:center"><div class="etykieta">Dołącz do lekcji</div>'+blokQR()+'</div>'); }
function pokazTrudne(){ nakladka('<div class="trudne"><div class="etykieta">Ściąga · trudne pytania uczniów</div><h2 class="ekran-tyt" style="font-size:1.6em">Krótkie odpowiedzi do powiedzenia własnymi słowami</h2>'+T.trudne.map(function(x){ return '<details><summary>Uczeń: '+esc(x.p)+'</summary><p>'+esc(x.o)+'</p></details>'; }).join("")+'</div>'); }
function panel(){ $("#panel").classList.toggle("otw"); var e=EKR[S.idx]; if(e.dyn) odswiez(); if(e.id==="refleksja") rysuj(); }

document.addEventListener("click", function(ev){
  var b=ev.target.closest("[data-akcja],[data-plus],[data-odsl],[data-reset],[data-wariant],[data-mod],[data-tryb],[data-etap],[data-os],[data-gr],[data-ngr],[data-karta],[data-teza],[data-ref],[data-widok],[data-ukryj],[data-postac],[data-ust],[data-minbtn],[data-minreset]");
  if(!b) return;
  var d=b.dataset, a;
  if(d.akcja){ ev.preventDefault(); a=d.akcja;
    if(a==="zacznij"){ if(!S.start) S.start=Date.now(); idz(1); }
    else if(a==="panel") panel();
    else if(a==="qr") pokazQR();
    else if(a==="trudne") pokazTrudne();
    else if(a==="zamknij") zamknijNak();
    else if(a==="pelny") pelny();
    else if(a==="nowa"){ if(confirm("Rozpocząć lekcję z nową klasą? Wyniki poprzedniej klasy zostaną wyczyszczone.")){ var w=S.wariant,mA=S.modA,mB=S.modB,rc=S.reczny; S=domyslny(); S.wariant=w; S.modA=mA; S.modB=mB; S.reczny=rc; R={}; MIN={}; ostatniCur=null; zapisz(); rysuj(); toast("Nowa klasa, kod "+S.kod); } }
    else if(a==="czyscgr"){ S.grupy.wyb=[]; zapisz(); odswiez(); }
    else if(a==="zakryjwsz"){ S.odwr={}; S.karta=-1; zapisz(); odswiez(); }
    else if(a==="zaslona"){ S.zaslona=!S.zaslona; zapisz(); odswiez(); }
    else if(a==="dodajnot") dodajNot();
    return; }
  if(d.plus){ var p=d.plus.split("|"); plus(p[0],+p[1],+p[2],+p[3]); return; }
  if(d.odsl){ p=d.odsl.split("|"); S.odsl[p[0]]=+p[1]; zapisz(); var e=EKR[S.idx]; e.dyn?odswiez():rysuj(); return; }
  if(d.reset){ if(!confirm("Wyczyścić głosy przy tym pytaniu?")) return; S.man[d.reset]=[]; S.odsl[d.reset]=0; S.notatki=S.notatki.filter(function(n){return n.q!==d.reset;}); delete R[d.reset]; if(NA_ZYWO()) post({akcja:"reset",q:d.reset}); zapisz(); odswiez(); return; }
  if(d.wariant){ S.wariant=d.wariant; zapisz(); rysuj(); return; }
  if(d.mod){ S[d.mod]=!S[d.mod]; zapisz(); rysuj(); return; }
  if(d.tryb){ S.reczny = d.tryb==="rek"; ostatniCur=null; zapisz(); rysuj(); return; }
  if(d.etap){ var i=EKR.findIndex(function(x){return x.etap===d.etap;}); if(i>=0) idz(i); return; }
  if(d.os){ S.os=+d.os; S.osWid[S.os]=1; zapisz(); odswiez(); return; }
  if(d.gr){ p=d.gr.split("|"); var g=S.grupy.wyb[+p[0]]||(S.grupy.wyb[+p[0]]=[]), k=+p[1], j=g.indexOf(k); if(j>=0) g.splice(j,1); else { if(g.length>=3){ toast("Grupa ma tylko 3 żetony."); return; } g.push(k); } zapisz(); odswiez(); return; }
  if(d.ngr){ S.grupy.n=+d.ngr; zapisz(); odswiez(); return; }
  if(d.karta){ S.karta=+d.karta; S.odwr[S.karta]=1; zapisz(); odswiez(); return; }
  if(d.teza){ S.teza=+d.teza; zapisz(); rysuj(); return; }
  if(d.ref){ S.ref=+d.ref; zapisz(); rysuj(); return; }
  if(d.widok){ S.widok=d.widok; zapisz(); odswiez(); return; }
  if(d.ukryj!==undefined){ S.ukryte[d.ukryj]=!S.ukryte[d.ukryj]; zapisz(); odswiez(); rysujPanelJesli(); return; }
  if(d.postac){ S.postac=S.postac===+d.postac?-1:+d.postac; zapisz(); odswiez(); return; }
  if(d.ust){ p=d.ust.split("|"); minReset(p[0],+p[1]*60000); return; }
  if(d.minbtn){ var m=MIN[d.minbtn]; if(m&&m.run) minPauza(d.minbtn); else minStart(d.minbtn); return; }
  if(d.minreset){ p=d.minreset.split("|"); minReset(p[0],+p[1]*60000); return; }
});
function rysujPanelJesli(){ if($("#panel").classList.contains("otw")) rysujPanel(); }
function dodajNot(){ var i=$("#nowaNot"); if(!i||!i.value.trim()) return; S.notatki.push({q:"ref"+S.ref,t:i.value.trim().slice(0,90)}); i.value=""; zapisz(); odswiez(); i.focus(); }
function pelny(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen(); }

document.addEventListener("keydown", function(ev){
  if(ev.target.tagName==="INPUT"){ if(ev.key==="Enter") dodajNot(); return; }
  var k=ev.key;
  if(!$("#nakladka").classList.contains("ukryj")){ if(k==="Escape"||k==="q"||k==="Q"||k==="t"||k==="T") zamknijNak(); return; }
  if(k==="ArrowRight"||k===" "||k==="PageDown"){ ev.preventDefault(); dalej(); }
  else if(k==="ArrowLeft"||k==="PageUp"){ ev.preventDefault(); wstecz(); }
  else if(k==="n"||k==="N") panel();
  else if(k==="q"||k==="Q") pokazQR();
  else if(k==="t"||k==="T") pokazTrudne();
  else if(k==="f"||k==="F") pelny();
  else if(k==="Escape") $("#panel").classList.remove("otw");
});
$("#dalej").onclick=dalej; $("#wstecz").onclick=wstecz;

/* odśwież ściągę z podglądem odpowiedzi */
setInterval(function(){ var e=EKR[S.idx]; if(e.id==="refleksja" && $("#panel").classList.contains("otw")) rysujPanel(); }, 5000);

(function(){ var m=location.hash.match(/^#e=(\w+)/); if(m){ zbuduj(); var i=EKR.findIndex(function(x){return x.id===m[1];}); if(i<0){ var e=EKR_WSZ.find(function(x){return x.id===m[1];}); if(e&&e.modul){ S[e.modul]=true; zbuduj(); i=EKR.findIndex(function(x){return x.id===m[1];}); } } if(i>=0) S.idx=i; } })();
rysuj();
if(NA_ZYWO()) fetch(ADRES).then(function(r){return r.json();}).then(function(){ustawPol("ok");}).catch(function(){ustawPol("blad");});
})();
</script>
