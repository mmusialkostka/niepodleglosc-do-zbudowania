<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0c0b">
<title>Niepodległość do zbudowania</title>
<meta name="description" content="Interaktywna lekcja wychowawcza na 11 listopada dla liceum. Ekran projektora z głosowaniem telefonami, symulacją i ściągą dla wychowawcy.">
<link rel="stylesheet" href="fonts/fonty.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0c0b'/%3E%3Crect x='6' y='9' width='20' height='7' fill='%23fff'/%3E%3Crect x='6' y='16' width='20' height='7' fill='%23a3171f'/%3E%3C/svg%3E">
<style>
:root{
  --tlo:#0d0c0b; --tlo2:#141210; --papier:#1a1816; --papier2:#211f1c; --tusz:#f2eee7; --szary:#a59e93; --jasny:#6d675e;
  --linia:#2a2724; --linia2:#3c3834; --czerwien:#dc2f3b; --czerwien2:#ef4450; --czerwienG:#a3171f;
  --cond:"Oswald","Arial Narrow","Roboto Condensed",sans-serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:var(--cond);
  --u:min(.94vw,1.68vh);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--tlo);color:var(--tusz);font-family:var(--sans);overflow:hidden}
body{font-size:calc(var(--u)*1.6);line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--cond);font-weight:500;margin:0;text-transform:uppercase;letter-spacing:.005em;line-height:1.05}
a{color:var(--czerwien2)}
.ukryj{display:none!important}

/* ---------- górny pasek ---------- */
#gora{position:fixed;top:0;left:0;right:0;height:calc(var(--u)*4.4);display:flex;align-items:center;gap:calc(var(--u)*1.4);padding:0 calc(var(--u)*2);background:var(--tlo);z-index:5;border-bottom:1px solid var(--linia)}
#gora .tyt{display:flex;align-items:center;gap:.6em;font-family:var(--cond);font-weight:500;font-size:.9em;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
#gora .tyt i{display:inline-flex;flex-direction:column;width:1.3em;height:.9em}
#gora .tyt i:before,#gora .tyt i:after{content:"";flex:1;background:#fff}#gora .tyt i:after{background:var(--czerwien)}
@media (max-width:1900px){#gora .tyt span{display:none}}
#etapy{display:flex;flex:1;gap:calc(var(--u)*.4);min-width:0}
#etapy button{flex:1;min-width:0;border:0;background:transparent;padding:calc(var(--u)*.5) calc(var(--u)*.5) calc(var(--u)*.35);text-align:left;border-bottom:2px solid var(--linia2);font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;font-size:.72em;color:var(--jasny);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#etapy button b{font-weight:500}
#etapy button.byl{border-bottom-color:#6d675e;color:var(--szary)}
#etapy button.teraz{border-bottom-color:var(--czerwien);color:var(--tusz)}
#etapy button span{color:var(--jasny);margin-left:.4em;font-weight:300}
.chip{display:inline-flex;align-items:center;gap:.45em;border:1px solid var(--linia2);border-radius:2px;padding:.2em .7em;font-size:.68em;white-space:nowrap;font-family:var(--cond);letter-spacing:.06em;text-transform:uppercase}
.chip .kropka{width:.55em;height:.55em;border-radius:50%;background:var(--jasny)}
.chip.ok .kropka{background:#3fbf7f}.chip.zle .kropka{background:var(--czerwien)}
#zegar{font-variant-numeric:tabular-nums}

/* ---------- scena ---------- */
#scena{position:absolute;top:calc(var(--u)*4.4);bottom:calc(var(--u)*4.2);left:0;right:0;display:flex;justify-content:center;overflow:auto;overflow-x:hidden}
#ekran{width:min(100%,calc(var(--u)*150));padding:calc(var(--u)*2.6) calc(var(--u)*4) calc(var(--u)*2);display:flex;flex-direction:column;min-height:100%}
#ekran>*:not(.foto-tlo):not(.podpis){position:relative;z-index:1}
.ekran-in>*:not(.foto-tlo):not(.podpis){animation:wej .45s ease-out both}
.ekran-in>*:nth-child(3){animation-delay:.06s}.ekran-in>*:nth-child(4){animation-delay:.12s}
@keyframes wej{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ekran-in>.foto-tlo{animation:fotoWej .9s ease-out both}
@keyframes fotoWej{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}

/* zdjęcia */
.foto-tlo{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.foto-tlo img{position:absolute;top:0;right:0;height:100%;width:52%;object-fit:cover;object-position:center 25%;filter:grayscale(1) contrast(1.12) brightness(.92)}
.foto-tlo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--tlo) 0%,var(--tlo) 46%,rgba(13,12,11,.55) 58%,rgba(13,12,11,.05) 80%,rgba(13,12,11,.2) 100%)}
.foto-tlo.pelne img{width:100%}
.foto-tlo.pelne:after{background:linear-gradient(90deg,rgba(13,12,11,.96) 0%,rgba(13,12,11,.82) 45%,rgba(13,12,11,.55) 100%)}
.foto-tlo.slabe img{opacity:.55;width:100%}
.foto-tlo.slabe:after{background:rgba(13,12,11,.82)}
.podpis{position:absolute;right:calc(var(--u)*1.6);bottom:calc(var(--u)*1);z-index:2;font-size:.55em;color:rgba(242,238,231,.65);max-width:40%;text-align:right;letter-spacing:.02em}
.fig{margin:0;display:flex;flex-direction:column;gap:.4em}
.fig img{width:100%;height:100%;min-height:0;object-fit:cover;filter:grayscale(1) contrast(1.1);display:block;flex:1}
.fig figcaption{font-size:.6em;color:var(--szary)}

.etykieta{display:flex;align-items:center;gap:.7em;font-family:var(--cond);font-size:.75em;letter-spacing:.12em;text-transform:uppercase;color:var(--szary);margin-bottom:calc(var(--u)*1.1)}
.etykieta b{background:var(--czerwien);color:#fff;font-weight:500;padding:.12em .55em}
.ekran-tyt{font-size:2.6em;line-height:1.04;margin-bottom:calc(var(--u)*1.6);max-width:30em}
.lead{font-family:var(--cond);font-weight:300;font-size:1.9em;line-height:1.25}
.mdl{color:var(--szary)}
.kolumny{display:grid;grid-template-columns:1.25fr 1fr;gap:calc(var(--u)*3);align-items:center;flex:1}
.karta{background:var(--papier);border:1px solid var(--linia);padding:calc(var(--u)*1.6) calc(var(--u)*1.8)}
.przyciski{display:flex;gap:calc(var(--u)*.8);flex-wrap:wrap;margin-top:calc(var(--u)*1.4);align-items:center}
.btn{border:1px solid var(--linia2);background:transparent;border-radius:0;padding:.55em 1.1em;font-family:var(--cond);font-size:.8em;letter-spacing:.08em;text-transform:uppercase;font-weight:500;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--tusz)}
.btn.glowny{background:var(--czerwien);border-color:var(--czerwien);color:#fff}
.btn.glowny:hover{background:var(--czerwien2)}
.btn.maly{font-size:.66em;padding:.35em .75em}
.btn[disabled]{opacity:.35;cursor:default}
.wniosek{border-left:3px solid var(--czerwien);padding:calc(var(--u)*.4) 0 calc(var(--u)*.4) calc(var(--u)*1.8);font-family:var(--cond);font-weight:300;font-size:1.55em;line-height:1.3}
.wniosek.duzy{font-size:2.5em;line-height:1.18;text-transform:uppercase}
.licznik{font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:.75em;color:var(--szary)}
.licznik b{color:var(--tusz);font-size:1.5em;font-weight:500;font-variant-numeric:tabular-nums;margin-left:.2em}

/* wielki numer */
.z-numerem{display:grid;grid-template-columns:calc(var(--u)*17) 1fr;gap:calc(var(--u)*3);align-items:start;flex:1}
.numer{font-family:var(--cond);font-weight:500;font-size:12em;line-height:1;margin-top:-.12em;color:transparent;-webkit-text-stroke:2px var(--tusz);letter-spacing:-.02em;position:relative}
.numer sub{display:block;margin-top:0;font-size:.15em;-webkit-text-stroke:0;color:var(--czerwien);letter-spacing:.06em;font-weight:400}

/* ---------- start ---------- */
.start{display:flex;flex-direction:column;justify-content:center;flex:1;max-width:50%;gap:calc(var(--u)*.9)}
.start h1{font-size:4.3em;line-height:.9;font-weight:600;letter-spacing:-.005em}
.start h1 em{display:block;font-style:normal;font-weight:200;color:var(--czerwien)}
.start .lead{font-size:1.2em;color:var(--szary);max-width:24em}
.ustaw{display:grid;grid-template-columns:auto 1fr;gap:calc(var(--u)*.7) calc(var(--u)*1.4);align-items:center;margin-top:calc(var(--u)*1.2);padding-top:calc(var(--u)*1.4);border-top:1px solid var(--linia2);font-size:.9em}
.ustaw h3{font-family:var(--cond);font-size:.72em;letter-spacing:.12em;color:var(--szary);font-weight:400}
.przel{display:flex;gap:4px;flex-wrap:wrap}
.przel button{border:1px solid var(--linia2);background:transparent;padding:.4em .85em;font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;font-size:.72em}
.przel button.wl{background:var(--tusz);color:var(--tlo);border-color:var(--tusz)}
.mini{font-size:.7em;color:var(--szary);line-height:1.45}
.kodsesji{font-family:var(--cond);font-size:1.5em;letter-spacing:.14em;font-weight:500;color:var(--tusz)}

/* ---------- QR ---------- */
.qrbox{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.8)}
.qrbox .qr{background:#fff;padding:calc(var(--u)*1.2)}
.qrbox .qr svg{display:block;width:calc(var(--u)*22);height:calc(var(--u)*22)}
.qrbox .adres{font-size:.75em;color:var(--szary);text-align:center;word-break:break-all}
.qrbox .adres b{color:var(--tusz);font-family:var(--cond);font-size:1.8em;letter-spacing:.14em;font-weight:500}

/* ---------- quiz ---------- */
.opcje{display:flex;flex-direction:column;gap:calc(var(--u)*.55)}
.opcja{position:relative;display:grid;grid-template-columns:calc(var(--u)*3) 1fr auto;align-items:center;gap:calc(var(--u)*1);background:var(--papier);border:1px solid var(--linia);padding:calc(var(--u)*.9) calc(var(--u)*1.2);overflow:hidden;font-size:1.02em}
.opcja .lit{font-family:var(--cond);font-weight:500;font-size:1.35em;color:var(--czerwien)}
.opcja .pasek{position:absolute;left:0;top:0;bottom:0;background:rgba(242,238,231,.08);z-index:0;transition:width .7s cubic-bezier(.2,.7,.2,1)}
.opcja>*:not(.pasek){position:relative;z-index:1}
.opcja .wyn{font-family:var(--cond);font-variant-numeric:tabular-nums;font-weight:500;display:flex;align-items:center;gap:.5em;font-size:1.05em}
.opcja.dobra{border-color:var(--czerwien);box-shadow:inset 4px 0 0 var(--czerwien)}
.opcja.dobra .pasek{background:rgba(220,47,59,.35)}
.opcja.zla{opacity:.4}
.plusminus{display:inline-flex;gap:3px}
.plusminus button{border:1px solid var(--linia2);background:var(--tlo2);width:1.6em;height:1.6em;font-size:.85em;line-height:1;padding:0}
.wyjasn{margin-top:calc(var(--u)*1.2);border-left:3px solid var(--czerwien);padding:calc(var(--u)*.3) 0 calc(var(--u)*.3) calc(var(--u)*1.4);font-size:.95em;color:var(--tusz)}
.odp-z-foto{display:grid;grid-template-columns:1fr calc(var(--u)*24);gap:calc(var(--u)*2);align-items:stretch;margin-top:calc(var(--u)*1.2)}
.odp-z-foto .wyjasn{margin-top:0}
.odp-z-foto .fig{height:calc(var(--u)*16)}

/* ---------- oś czasu ---------- */
.os{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--linia2);margin-bottom:calc(var(--u)*1.6)}
.punkt{border:0;background:transparent;padding:calc(var(--u)*.7) 0 0;text-align:left;position:relative;font-family:var(--cond);color:var(--jasny);letter-spacing:.04em}
.punkt:before{content:"";position:absolute;top:-1px;left:0;right:calc(var(--u)*1);height:3px;background:transparent;transition:background .2s}
.punkt i{display:none}
.punkt span{font-size:1.15em;font-weight:500}
.punkt.wid{color:var(--szary)}
.punkt.akt{color:var(--tusz)}
.punkt.akt:before{background:var(--czerwien)}
.punkt.jedenasty span{color:var(--czerwien2)}
.os-opis{flex:1;min-height:0}
.os-det{display:grid;grid-template-columns:auto 1fr calc(var(--u)*30);gap:calc(var(--u)*2.6);align-items:start;height:100%}
.os-det .dzien{font-family:var(--cond);line-height:.8;text-align:left}
.os-det .dzien b{display:block;font-size:11em;font-weight:500;color:transparent;-webkit-text-stroke:2px var(--tusz)}
.os-det .dzien span{display:block;font-size:1.2em;letter-spacing:.2em;color:var(--czerwien);margin-top:.9em;font-weight:400}
.os-det .wyd{font-family:var(--cond);font-weight:300;font-size:1.75em;line-height:1.28}
.os-det .arg{margin-top:1em;color:var(--szary);font-size:.95em;border-top:1px solid var(--linia2);padding-top:.8em}
.os-det .arg b{display:block;color:var(--czerwien);font-family:var(--cond);font-weight:500;text-transform:uppercase;letter-spacing:.1em;font-size:.8em;margin-bottom:.2em}
.os-det .fig{height:calc(var(--u)*30)}

/* ---------- wyniki daty (pionowe słupki) ---------- */
.slupki{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:calc(var(--u)*.8);align-items:end;height:calc(var(--u)*22);margin-top:calc(var(--u)*1)}
.slupek{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:.3em}
.slupek .s{width:62%;background:var(--linia2);transition:height .7s cubic-bezier(.2,.7,.2,1);min-height:2px}
.slupek.max .s{background:var(--czerwien)}
.slupek .l{font-family:var(--cond);font-size:1.4em;font-weight:500;font-variant-numeric:tabular-nums}
.slupek .d{font-family:var(--cond);font-size:.95em;text-align:center;line-height:1.2;color:var(--szary);letter-spacing:.04em;height:1.6em}
.slupek.jedenasty .d{color:var(--czerwien2)}

/* ---------- symulacja ---------- */
.kroki{display:flex;flex-direction:column;counter-reset:k}
.krok{display:grid;grid-template-columns:calc(var(--u)*3.6) 1fr auto;gap:calc(var(--u)*1);align-items:baseline;padding:calc(var(--u)*.8) 0;border-bottom:1px solid var(--linia2)}
.krok:before{counter-increment:k;content:"0" counter(k);font-family:var(--cond);font-size:1.3em;color:var(--czerwien);font-weight:500}
.krok .cz{font-family:var(--cond);font-size:.8em;color:var(--szary);letter-spacing:.08em;text-transform:uppercase}
.minutnik{font-family:var(--cond);font-size:9em;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:-.01em}
.minutnik.koniec{color:var(--czerwien)}
.zetony{display:flex;gap:.6em;justify-content:center;margin:calc(var(--u)*.6) 0 calc(var(--u)*1)}
.zetony i{width:calc(var(--u)*2.6);height:calc(var(--u)*2.6);border-radius:50%;background:var(--czerwien)}
.sym-prawa{border:1px solid var(--linia2);background:rgba(13,12,11,.6);padding:calc(var(--u)*2);text-align:center}
.siatka{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:4px;font-size:.85em}
.siatka th{font-family:var(--cond);font-weight:400;text-transform:uppercase;letter-spacing:.04em;font-size:.78em;color:var(--szary);padding:.3em;text-align:center;line-height:1.2}
.siatka th.gr{width:calc(var(--u)*7);text-align:left;color:var(--tusz)}
.siatka td button{width:100%;height:calc(var(--u)*3);border:1px solid var(--linia2);background:var(--papier)}
.siatka td button.wl{background:var(--czerwien);border-color:var(--czerwien);color:#fff}
.siatka td.zet{font-family:var(--cond);font-variant-numeric:tabular-nums;text-align:center;color:var(--szary);white-space:nowrap}
.poziome{display:flex;flex-direction:column;gap:calc(var(--u)*.5)}
.poz{display:grid;grid-template-columns:calc(var(--u)*12) 1fr calc(var(--u)*6);align-items:center;gap:calc(var(--u)*.8);font-size:.85em}
.poz .t{height:calc(var(--u)*1.4);background:var(--tlo2);overflow:hidden}
.poz .t i{display:block;height:100%;background:var(--tusz);transition:width .6s}
.poz.zero{color:var(--czerwien2)}
.poz .n{font-family:var(--cond);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:1.1em}
.poz.zero .n:after{content:" pominięty";font-size:.7em;font-weight:400;text-transform:uppercase;letter-spacing:.06em}
.odsl{display:grid;grid-template-columns:calc(var(--u)*22) 1fr;gap:calc(var(--u)*2.4);align-items:stretch;flex:1}
.lista7{display:flex;flex-direction:column;gap:calc(var(--u)*.35)}
.k7{display:grid;grid-template-columns:calc(var(--u)*2.6) 1fr auto;align-items:center;gap:.5em;text-align:left;border:0;border-bottom:1px solid var(--linia2);background:transparent;padding:.5em .2em;font-family:var(--cond);text-transform:uppercase;letter-spacing:.04em;font-size:1em}
.k7 .nr{font-weight:500;color:var(--jasny);font-size:1.1em}
.k7 .gl{font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:.62em;color:var(--szary);white-space:nowrap}
.k7.odw .nr{color:var(--czerwien)}
.k7.akt{background:var(--czerwien);color:#fff;border-color:var(--czerwien)}
.k7.akt .nr,.k7.akt .gl{color:#fff}
.szczeg{min-height:calc(var(--u)*30)}
.szczeg-in{display:grid;grid-template-columns:1fr calc(var(--u)*30);gap:calc(var(--u)*2.4);height:100%}
.szczeg-in.bez{grid-template-columns:1fr calc(var(--u)*16)}
.gr7{display:flex;align-items:baseline;gap:.4em}
.gr7 .nr{font-family:var(--cond);font-size:2.6em;color:var(--czerwien);font-weight:500;line-height:1}
.gr7 h3{font-size:2.6em}
.szczeg .pr{color:var(--szary);margin:.5em 0 1.1em;font-size:.95em}
.dwie{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2);border-top:1px solid var(--linia2);padding-top:1em}
.dwie b{font-family:var(--cond);font-weight:500;font-size:.78em;letter-spacing:.12em;text-transform:uppercase;color:var(--czerwien2)}
.dwie p{margin:.4em 0 0;font-size:.98em;line-height:1.45}
.szczeg .fig{height:100%;max-height:calc(var(--u)*34)}
.wielki-nr{overflow:hidden;font-family:var(--cond);font-weight:500;font-size:10em;line-height:.8;color:transparent;-webkit-text-stroke:2px var(--linia2);text-align:right}

/* ---------- linia wartości ---------- */
.tezy{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:calc(var(--u)*1.4)}
.tezy button{border:1px solid var(--linia2);background:transparent;padding:.3em .8em;font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:.68em}
.tezy button.wl{background:var(--tusz);color:var(--tlo);border-color:var(--tusz)}
.teza{font-family:var(--cond);font-weight:300;font-size:2.7em;line-height:1.15;margin-bottom:calc(var(--u)*1.6);text-transform:uppercase}
.linia{position:relative;height:calc(var(--u)*17);margin:0 calc(var(--u)*1)}
.linia .os2{position:absolute;left:0;right:0;bottom:calc(var(--u)*3);height:3px;background:linear-gradient(90deg,#fff,var(--linia2) 50%,var(--czerwien))}
.linia .kr{position:absolute;bottom:calc(var(--u)*3 - var(--u)*.55);width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);margin-left:calc(var(--u)*-.55);border-radius:50%;background:var(--tusz);transition:left .6s,bottom .6s}
.linia .opis{position:absolute;bottom:0;font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:.72em;color:var(--szary)}
.linia .opis.p{right:0}
.linia .sr{position:absolute;bottom:calc(var(--u)*3);width:2px;margin-left:-1px;height:calc(var(--u)*13);background:var(--czerwien)}
.linia .sr span{position:absolute;top:-1.5em;left:50%;transform:translateX(-50%);font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:.65em;white-space:nowrap;color:var(--czerwien2)}
.segmenty{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:calc(var(--u)*1)}
.segmenty div{display:flex;flex-direction:column;align-items:center;gap:.3em;font-size:.7em;color:var(--szary);text-align:center}

/* ---------- refleksja ---------- */
.sciana{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.7);align-content:flex-start;min-height:calc(var(--u)*18);padding:calc(var(--u)*.5) 0}
.kart{background:var(--tusz);color:var(--tlo);padding:.55em .85em;font-size:1em;max-width:calc(var(--u)*32);animation:wej .4s ease-out;cursor:pointer;line-height:1.3;font-weight:500}
.kart:nth-child(5n+2){background:var(--czerwien);color:#fff}
.kart.ukr{opacity:.2;text-decoration:line-through}
.chmura{display:flex;flex-wrap:wrap;gap:.2em .9em;justify-content:center;align-items:center;min-height:calc(var(--u)*20);padding:calc(var(--u)*1);font-family:var(--cond);text-transform:uppercase}
.chmura span{line-height:1.05;cursor:pointer}
.zaslona{display:flex;align-items:center;justify-content:center;min-height:calc(var(--u)*18);color:var(--szary);border:1px dashed var(--linia2)}
.wpisz{display:flex;gap:.5em;margin-top:calc(var(--u)*.8)}
.wpisz input{flex:1;font:inherit;font-size:.85em;padding:.5em .8em;border:1px solid var(--linia2);background:var(--papier);color:var(--tusz)}

/* ---------- moduły ---------- */
.postacie{display:grid;grid-template-columns:repeat(7,1fr);gap:calc(var(--u)*.8)}
.postac{border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:.35em}
.postac img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center 20%;filter:grayscale(1) contrast(1.1);opacity:.75;transition:opacity .2s}
.postac:hover img,.postac.akt img{opacity:1}
.postac h3{font-size:.95em;line-height:1.1}
.postac .lata{font-size:.62em;color:var(--szary)}
.postac p{display:none}
.postac.akt h3{color:var(--czerwien2)}
.postac.akt img{outline:3px solid var(--czerwien);outline-offset:-3px}
.bio-ekran{margin-top:calc(var(--u)*1.4);border-top:1px solid var(--linia2);padding-top:calc(var(--u)*1.2)}
.bio-ekran h3{font-size:1.6em}
.historia{display:flex;flex-direction:column}
.historia div{display:grid;grid-template-columns:calc(var(--u)*17) 1fr;gap:calc(var(--u)*1.5);padding:calc(var(--u)*.8) 0;border-bottom:1px solid var(--linia2);align-items:baseline}
.historia b{font-family:var(--cond);font-size:2em;font-weight:500;color:transparent;-webkit-text-stroke:1.5px var(--tusz);line-height:1}
.historia div:nth-child(2) b,.historia div:nth-child(5) b{-webkit-text-stroke:0;color:var(--czerwien)}

/* ---------- koniec ---------- */
.koniec{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:calc(var(--u)*2.4);max-width:70%}
.koniec .zd{font-family:var(--cond);font-weight:300;font-size:3em;line-height:1.15;text-transform:uppercase;border-left:3px solid var(--czerwien);padding-left:calc(var(--u)*2)}
.koniec .daty{font-family:var(--cond);font-size:1em;letter-spacing:.3em;text-transform:uppercase;color:var(--szary);padding-left:calc(var(--u)*2.2)}
.koniec .pas2{width:calc(var(--u)*10);height:calc(var(--u)*1.3);display:flex;flex-direction:column;margin-left:calc(var(--u)*2.2)}
.koniec .pas2 i{flex:1;background:#fff}.koniec .pas2 i+i{background:var(--czerwien)}

/* ---------- dolny pasek ---------- */
#dol{position:fixed;bottom:0;left:0;right:0;height:calc(var(--u)*4.2);display:flex;align-items:center;gap:calc(var(--u)*.8);padding:0 calc(var(--u)*2);border-top:1px solid var(--linia);background:var(--tlo);z-index:5}
#dol .btn{font-size:.68em}
#nr{font-family:var(--cond);font-size:.75em;color:var(--szary);font-variant-numeric:tabular-nums;margin:0 .5em;letter-spacing:.08em}
.odstep{flex:1}
kbd{font-family:var(--sans);font-size:.85em;border:1px solid var(--linia2);padding:0 .35em;margin-left:.3em;text-transform:none;color:var(--szary)}

/* ---------- panel nauczyciela (jasny, jak kartka) ---------- */
#panel{position:fixed;top:calc(var(--u)*4.4);bottom:calc(var(--u)*4.2);right:0;width:min(34vw,560px);background:#efe9df;color:#1f1d1a;z-index:6;transform:translateX(102%);transition:transform .3s ease;overflow:auto;padding:calc(var(--u)*1.6);font-size:.82em;box-shadow:-10px 0 40px rgba(0,0,0,.5)}
#panel.otw{transform:none}
#panel h2{font-size:1.6em;color:#1f1d1a;margin-bottom:.2em}
#panel h4{font-family:var(--cond);font-weight:500;font-size:.75em;letter-spacing:.14em;text-transform:uppercase;color:var(--czerwienG);margin:1.3em 0 .4em}
#panel ul{margin:0;padding-left:1.1em}
#panel li{margin:.25em 0}
#panel .pow{background:#fff;border-left:3px solid var(--czerwienG);padding:.5em .8em;margin:.35em 0;font-style:italic}
#panel .btn{color:#1f1d1a;border-color:#bdb4a5}
#panel .tmr{display:flex;align-items:center;gap:.6em;background:#fff;padding:.6em .8em;margin-top:.6em}
#panel .tmr .t{font-family:var(--cond);font-size:2em;font-variant-numeric:tabular-nums;min-width:3em}
#panel .tmr.koniec .t{color:var(--czerwienG)}
#panel .czas{color:#6b645a}
#panel details{border-top:1px solid #d6cdbd;padding:.45em 0}
#panel summary{cursor:pointer;font-weight:600}
#panel details p{margin:.4em 0 .2em;color:#3d3832}

/* ---------- nakładki ---------- */
.nakladka{position:fixed;inset:0;background:rgba(13,12,11,.97);z-index:10;display:flex;align-items:center;justify-content:center;padding:calc(var(--u)*3)}
.nakladka .zamk{position:absolute;top:calc(var(--u)*1.5);right:calc(var(--u)*2)}
.nakladka .qrbox .qr svg{width:min(60vh,calc(var(--u)*40));height:min(60vh,calc(var(--u)*40))}
.nakladka .etykieta{justify-content:center}
.trudne{max-width:calc(var(--u)*110);width:100%;max-height:100%;overflow:auto}
.trudne .etykieta{justify-content:flex-start}
.trudne details{border-bottom:1px solid var(--linia2);padding:calc(var(--u)*.9) 0}
.trudne summary{cursor:pointer;font-family:var(--cond);font-size:1.2em;font-weight:400;letter-spacing:.01em}
.trudne p{margin:.6em 0 .2em;font-size:.95em;color:var(--szary)}
#toast{position:fixed;left:50%;bottom:calc(var(--u)*5.5);transform:translateX(-50%);background:var(--czerwien);color:#fff;padding:.5em 1em;font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:.75em;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.wid{opacity:1}
@media (max-aspect-ratio:4/3){.kolumny{grid-template-columns:1fr}.start{max-width:100%}.odsl,.dwie,.szczeg-in,.os-det,.z-numerem{grid-template-columns:1fr}.postacie{grid-template-columns:repeat(4,1fr)}.foto-tlo img{width:100%;opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="gora">
  <div class="tyt"><i></i><span>Niepodległość do zbudowania</span></div>
  <nav id="etapy"></nav>
  <span class="chip" id="polacz"><span class="kropka"></span><span id="polaczTxt">tryb ręczny</span></span>
  <span class="chip" title="Czas od rozpoczęcia lekcji"><span id="zegar">0:00</span></span>
</header>
<main id="scena"><div id="ekran"></div></main>
<footer id="dol">
  <button class="btn" id="wstecz" title="Poprzedni ekran (←)">← Wstecz</button>
  <span id="nr"></span>
  <button class="btn glowny" id="dalej" title="Następny ekran (→ lub spacja)">Dalej →</button>
  <span class="odstep"></span>
  <button class="btn" data-akcja="qr" title="Kod QR dla spóźnionych (Q)">Kod QR <kbd>Q</kbd></button>
  <button class="btn" data-akcja="trudne" title="Trudne pytania uczniów (T)">Trudne pytania <kbd>T</kbd></button>
  <button class="btn" data-akcja="panel" title="Ściąga dla wychowawcy (N)">Ściąga <kbd>N</kbd></button>
  <button class="btn" data-akcja="pelny" title="Pełny ekran (F)"><kbd>F</kbd></button>
</footer>
<aside id="panel" aria-label="Ściąga dla wychowawcy"></aside>
<div id="nakladka" class="nakladka ukryj"></div>
<div id="toast"></div>

<script src="tresc.js"></script>
<script src="ustawienia.js"></script>
<script src="qrcode.js"></script>
<script src="img/zrodla.js"></script>
<script>
(function(){
"use strict";
var T = window.TRESC, U = window.USTAWIENIA || {};
var ADRES = (U.ADRES || "").trim();
var KLUCZ = "ndz-stan-v1";
var LITERY = "ABCDEFGH";

/* ================= stan ================= */
function nowyKod(){ var a="ABCDEFGHJKLMNPRSTUWXYZ23456789", s=""; for(var i=0;i<5;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
function nowyTok(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function domyslny(){
  var d=new Date(); var przed = (d.getMonth()<10) || (d.getMonth()===10 && d.getDate()<11);
  return { wariant: przed?"przed":"po", modA:false, modB:false, reczny: !ADRES, kod:nowyKod(), tok:nowyTok(),
    idx:0, start:0, odsl:{}, man:{}, grupy:{n:5, wyb:[]}, odwr:{}, teza:0, ref:0, karta:-1, notatki:[], ukryte:{}, widok:"sciana", zaslona:false, os:-1, osWid:{}, postac:-1 };
}
var S;
try { S = JSON.parse(localStorage.getItem(KLUCZ)) || domyslny(); } catch(e){ S = domyslny(); }
var D = domyslny(); for (var k in D) if (!(k in S)) S[k]=D[k];
if (!ADRES) S.reczny = true;
function zapisz(){ try{ localStorage.setItem(KLUCZ, JSON.stringify(S)); }catch(e){} }

/* ================= pomocnicze ================= */
function $(s,r){ return (r||document).querySelector(s); }
function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function toast(t){ var e=$("#toast"); e.textContent=t; e.classList.add("wid"); clearTimeout(toast.t); toast.t=setTimeout(function(){e.classList.remove("wid");},2200); }
function mmss(ms){ ms=Math.max(0,Math.round(ms/1000)); return Math.floor(ms/60)+":"+("0"+ms%60).slice(-2); }
var WULG = /(k+u+r+w|ch+u+j|\bh+u+j|p+i+e+r+d+o+l|\bj+e+b|zaj+e+b|wyj+e+b|p+i+z+d|k+u+t+a+s|d+z+i+w+k|sk+u+r+w|sp+i+e+r+d|c+i+p+a|f+u+c+k|sh+i+t)\w*/gi;
function czysc(t){ return String(t).replace(WULG, function(w){ return w[0]+"•••"; }); }
function norm(x){ return String(x).toLowerCase().replace(/[.,!?;:"„”…]+/g,"").replace(/\s+/g," ").trim(); }
function wariant(){ return T.warianty[S.wariant] || T.warianty.przed; }

/* ================= zdjęcia ================= */
var FOTO = window.FOTO || {};
function podpis(k){ var f=FOTO[k]; return f ? esc(f.opis)+' · '+esc(f.licencja)+', Wikimedia Commons' : ''; }
function fotoTlo(k, typ){ if(!FOTO[k]) return ''; return '<div class="foto-tlo '+(typ||'')+'"><img src="img/'+k+'.jpg" alt=""></div><div class="podpis">'+podpis(k)+'</div>'; }
function fig(k){ if(!FOTO[k]) return ''; return '<figure class="fig"><img src="img/'+k+'.jpg" alt="'+esc(FOTO[k].opis)+'"><figcaption>'+podpis(k)+'</figcaption></figure>'; }
function etyk(a,b){ return '<div class="etykieta"><b>'+esc(a)+'</b>'+(b?'<span>'+esc(b)+'</span>':'')+'</div>'; }
var OS_FOTO = ["rada","daszynski","pilsudski2","compiegne",null,"pilsudski","sejm1919"];
var KARTA_FOTO = {0:"marka",2:"haller",3:"wielkopolska",5:"sejm1919"};
var POSTAC_FOTO = ["pilsudski2","dmowski","paderewski","witos","daszynski","korfanty","moraczewska"];
var RZYM = {"X":"października","XI":"listopada"};

/* ================= adres strony uczniów ================= */
function bazowy(){
  if (/^https?:/.test(location.protocol)) return location.href.replace(/[#?].*$/,"").replace(/[^\/]*$/,"");
  return (U.STRONA||"").replace(/\/?$/,"/");
}
function adresUcznia(){ return bazowy()+"glos.html?s="+S.kod; }
function qrSvg(tekst){
  var q=qrcode(0,"M"); q.addData(tekst); q.make();
  var n=q.getModuleCount(), m=2, p="";
  for(var r=0;r<n;r++) for(var c=0;c<n;c++) if(q.isDark(r,c)) p+="M"+(c+m)+" "+(r+m)+"h1v1h-1z";
  return '<svg viewBox="0 0 '+(n+2*m)+' '+(n+2*m)+'" shape-rendering="crispEdges"><path d="'+p+'" fill="#23211e"/></svg>';
}
function blokQR(){
  return '<div class="qrbox"><div class="qr">'+qrSvg(adresUcznia())+'</div><div class="adres">'+esc(adresUcznia().replace(/^https?:\/\//,"").replace(/glos\.html\?s=.*/,"glos.html"))+'<br>kod klasy: <b>'+S.kod+'</b></div></div>';
}

/* ================= łączność z zapleczem ================= */
var NA_ZYWO = function(){ return !!ADRES && !S.reczny; };
var R = {};              // wyniki z telefonów: {qid:{n, v:[]}}
var ostatniCur = null, stanPol = "brak";
function ustawPol(s){ stanPol=s; var e=$("#polacz"); e.classList.toggle("ok", s==="ok"); e.classList.toggle("zle", s==="blad");
  $("#polaczTxt").textContent = !NA_ZYWO() ? "tryb ręczny" : s==="ok" ? "telefony: kod "+S.kod : s==="blad" ? "brak połączenia" : "łączenie…"; }
function post(obj){
  obj.s=S.kod; obj.tok=S.tok;
  return fetch(ADRES,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj)})
    .then(function(r){return r.json();}).then(function(j){ if(j.ok) ustawPol("ok"); else if(j.blad==="token"){ toast("Ten kod klasy jest zajęty. Kliknij „Nowa klasa” na ekranie startowym."); ustawPol("blad"); } return j; })
    .catch(function(){ ustawPol("blad"); });
}
function ustawCur(p){
  if (!NA_ZYWO()) return;
  var klucz = JSON.stringify(p);
  if (klucz === ostatniCur) return;
  ostatniCur = klucz;
  post({akcja:"pytanie", p:p}).then(function(j){ if(!j||!j.ok) ostatniCur=null; });
}
function pobierz(qid){
  if (!NA_ZYWO() || !qid) return;
  fetch(ADRES+"?co=wyniki&s="+S.kod+"&q="+encodeURIComponent(qid)).then(function(r){return r.json();}).then(function(j){
    if(!j.ok) return; ustawPol("ok");
    var stare = JSON.stringify(R[qid]); R[qid]={n:j.n, v:j.v};
    if (stare !== JSON.stringify(R[qid])) odswiez();
  }).catch(function(){ ustawPol("blad"); });
}
setInterval(function(){ var e=EKR[S.idx]; if(e && e.q && document.visibilityState==="visible") pobierz(e.q()); }, 2500);
setInterval(function(){ if(NA_ZYWO()) ostatniCur=null, ustawCur(curDla(EKR[S.idx])); }, 30000); // odświeżenie, gdyby pamięć wygasła

/* liczenie głosów: telefony + ręczne */
function liczby(qid, n){
  var a=[]; for(var i=0;i<n;i++) a[i]=0;
  var m=S.man[qid]||[]; for(i=0;i<n;i++) a[i]+= (m[i]||0);
  if (NA_ZYWO() && R[qid]) R[qid].v.forEach(function(v){ if(v>=0&&v<n) a[v]++; });
  return a;
}
function plus(qid,i,d,n){ var m=S.man[qid]||(S.man[qid]=[]); for(var j=0;j<n;j++) m[j]=m[j]||0; m[i]=Math.max(0,m[i]+d); zapisz(); odswiez(); }
function pokazPM(){ return S.reczny || $("#panel").classList.contains("otw"); }

/* ================= minutniki ================= */
var MIN = {}; // nazwa -> {dur, end, left, run, dzwonek}
function minStart(n,dur){ var m=MIN[n]; if(!m||dur){ m=MIN[n]={dur:dur||m.dur,left:dur||m.dur,run:false,dz:false}; } if(m.left<=0) m.left=m.dur, m.dz=false; m.end=Date.now()+m.left; m.run=true; tik(); }
function minPauza(n){ var m=MIN[n]; if(!m) return; if(m.run){ m.left=m.end-Date.now(); m.run=false; } tik(); }
function minReset(n,dur){ MIN[n]={dur:dur,left:dur,run:false,dz:false}; tik(); }
function minPoz(n){ var m=MIN[n]; if(!m) return 0; return m.run? m.end-Date.now() : m.left; }
function dzwonek(){
  try{ var c=new (window.AudioContext||window.webkitAudioContext)(); [660,880,660].forEach(function(f,i){ var o=c.createOscillator(), g=c.createGain(); o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(c.destination); var t=c.currentTime+i*.35; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.18,t+.04); g.gain.exponentialRampToValueAtTime(.001,t+.9); o.start(t); o.stop(t+1); }); }catch(e){}
}
function tik(){
  for (var n in MIN){ var m=MIN[n]; if(m.run && m.end-Date.now()<=0){ m.run=false; m.left=0; if(!m.dz){ m.dz=true; dzwonek(); toast("Koniec czasu"); } } }
  document.querySelectorAll("[data-min]").forEach(function(el){ var n=el.getAttribute("data-min"); el.textContent=mmss(minPoz(n)); var k=MIN[n]&&MIN[n].left<=0&&!MIN[n].run; el.closest(".tmr,.minutnik") && el.closest(".tmr,.minutnik").classList.toggle("koniec", !!k); if(el.classList.contains("minutnik")) el.classList.toggle("koniec",!!k); });
  document.querySelectorAll("[data-minbtn]").forEach(function(b){ var m=MIN[b.getAttribute("data-minbtn")]; b.textContent = m&&m.run ? "Pauza" : "Start"; });
  $("#zegar").textContent = S.start ? mmss(Date.now()-S.start) : "0:00";
}
setInterval(tik, 500);

/* ================= etapy ================= */
var ETAPY = [
  {id:"s", nazwa:"Start", min:0},
  {id:"1", nazwa:"1. Wejście", min:5},
  {id:"2", nazwa:"2. Śledztwo", min:8},
  {id:"3", nazwa:"3. Państwo od zera", min:20},
  {id:"4", nazwa:"4. Zamknięcie", min:10},
  {id:"p", nazwa:"Puenta", min:2},
  {id:"m", nazwa:"Moduł A", min:20}
];

/* ================= ekrany ================= */
function quiz(qid, P, etap, nrPyt){
  return {
    id:qid, etap:etap, q:function(){return qid;},
    sciaga: nrPyt===1 ? {czas:"2 min", powiedz:["Zacznijmy od szybkiego sprawdzianu, bez ocen. Co właściwie wydarzyło się 11 listopada 1918 roku? Głosujcie na telefonach."],
        oczekuj:["Poczekaj, aż licznik głosów przestanie rosnąć (zwykle 30–60 s). Kliknij „Pokaż wyniki”, a potem „Pokaż odpowiedź”."], uwagi:[]}
      : {czas:"2 min", powiedz:["Drugie pytanie: ile walut było w obiegu na ziemiach polskich pod koniec 1918 roku?"],
        oczekuj:["Większość zgaduje „jedną” albo „dwie”. Po odsłonie przeczytaj zdanie przejścia z ekranu."], uwagi:[]},
    cur:function(){ return {id:qid, typ:"wybor", tresc:P.tresc, opcje:P.opcje}; },
    html:function(){
      return '<div class="z-numerem"><div class="numer">0'+nrPyt+'<sub>/ 02</sub></div><div>'+etyk("Etap 1 · Wejście","Pytanie "+nrPyt+" z 2")+'<h2 class="ekran-tyt">'+esc(P.tresc)+'</h2><div id="dyn"></div></div></div>';
    },
    dyn:function(){
      var o=S.odsl[qid]||0, n=P.opcje.length, l=liczby(qid,n), suma=l.reduce(function(a,b){return a+b;},0), mx=Math.max.apply(null,l.concat([1]));
      var h='<div class="opcje">';
      P.opcje.forEach(function(t,i){
        var kl = o>=2 ? (i===P.poprawna?" dobra":" zla") : "";
        h+='<div class="opcja'+kl+'"><div class="pasek" style="width:'+(o>=1? (l[i]/Math.max(suma,1)*100):0)+'%"></div><span class="lit">'+LITERY[i]+'</span><span>'+esc(t)+'</span><span class="wyn">'+
          (o>=1? l[i]+' <span class="mdl" style="font-weight:400">('+Math.round(l[i]/Math.max(suma,1)*100)+'%)</span>':'')+
          (pokazPM()? '<span class="plusminus"><button data-plus="'+qid+'|'+i+'|-1|'+n+'">−</button><button data-plus="'+qid+'|'+i+'|1|'+n+'">+</button></span>':'')+'</span></div>';
      });
      h+='</div><div class="przyciski"><span class="licznik">Głosów: <b>'+suma+'</b></span><span class="odstep"></span>'+

      var h='<div class="linia"><div class="os2"></div>';
      var kosz={}; vals.forEach(function(v){ var b=Math.round(v/4); kosz[b]=(kosz[b]||0)+1; var y=kosz[b]-1; h+='<span class="kr" style="left:'+(b*4)+'%;bottom:calc(var(--u)*'+(3.9+y*1.25)+')"></span>'; });
      if(n){ var sr=vals.reduce(function(a,b){return a+b;},0)/n; h+='<span class="sr" style="left:'+sr+'%"><span>średnio</span></span>'; }
      h+='<span class="opis">← '+esc(T.linia.lewo)+'</span><span class="opis p">'+esc(T.linia.prawo)+' →</span></div>';
      h+='<div class="przyciski"><span class="licznik">Ustawień na linii: <b>'+n+'</b></span><span class="odstep"></span><button class="btn maly" data-reset="'+qid+'">Wyczyść</button></div>';
      if(pokazPM()){ var m=S.man[qid]||[]; h+='<div class="segmenty">'; ["zdecydowanie nie","raczej nie","nie wiem","raczej tak","zdecydowanie tak"].forEach(function(t,i){ h+='<div><span class="plusminus"><button data-plus="'+qid+'|'+i+'|-1|5">−</button><button data-plus="'+qid+'|'+i+'|1|5">+</button></span>'+t+' ('+(m[i]||0)+')</div>'; }); h+='</div>'; }
      return h;
    },
    sciaga:{czas:"4 min", powiedz:["Teraz nie o historii, tylko o was. Na telefonie przesuńcie suwak tak, jak bardzo zgadzacie się z tezą. Nikt nie widzi, kto gdzie stoi."],
      oczekuj:["Wybierz 2–3 tezy (przyciski nad tezą). Po każdej zapytaj: „Dlaczego ktoś mógłby stanąć po drugiej stronie?”"].concat(T.linia.zasady),
      uwagi:["Bez telefonów: uczniowie stają wzdłuż sali (jedna ściana: nie zgadzam się, druga: zgadzam się). Liczby wpisujesz w pięciu przedziałach przyciskami + i −.","Nie oceniaj stanowisk i nie wchodź w spory partyjne. Jeśli rozmowa skręca w politykę bieżącą, użyj odpowiedzi z „Trudnych pytań” (klawisz T)."]}
  },
  { id:"refleksja", etap:"4", q:function(){return "ref"+S.ref;},
    cur:function(){ return {id:"ref"+S.ref,typ:"tekst",tresc:T.refleksja[S.ref]}; },
    html:function(){
      var h=etyk("Etap 4 · Refleksja","Odpowiedzi anonimowe")+'<div class="tezy">';
      T.refleksja.forEach(function(t,i){ h+='<button class="'+(i===S.ref?"wl":"")+'" data-ref="'+i+'">Pytanie '+(i+1)+'</button>'; });
      h+='</div><h2 class="teza" style="font-weight:400">'+esc(T.refleksja[S.ref])+'</h2><div id="dyn"></div>';
      if(pokazPM()) h+='<div class="wpisz"><input id="nowaNot" maxlength="90" placeholder="Wpisz odpowiedź z karteczki i naciśnij Enter"><button class="btn" data-akcja="dodajnot">Dodaj</button></div>';
      return h;
    },
    dyn:function(){
      var qid="ref"+S.ref, t=tekstyRef(qid);
      var h='<div class="przyciski" style="margin:0 0 .6em"><span class="licznik">Odpowiedzi: <b>'+t.length+'</b></span><span class="odstep"></span>'+
        '<div class="przel"><button data-widok="sciana" class="'+(S.widok==="sciana"?"wl":"")+'">Karteczki</button><button data-widok="chmura" class="'+(S.widok==="chmura"?"wl":"")+'">Chmura</button><button data-akcja="zaslona" class="'+(S.zaslona?"wl":"")+'">Zasłoń</button></div></div>';
      if(S.zaslona) return h+'<div class="zaslona">Odpowiedzi są zasłonięte. Przeczytaj je najpierw sam(a) na ściądze lub kliknij „Zasłoń” ponownie.</div>';
      if(S.widok==="chmura"){
        var c={}; t.forEach(function(x){ var k=norm(x); if(!k||S.ukryte[k]) return; c[k]=(c[k]||0)+1; });
        var kl=Object.keys(c), mx=Math.max.apply(null,kl.map(function(k){return c[k];}).concat([1]));
        h+='<div class="chmura">'; kl.sort(function(){return Math.random()-.5;}).forEach(function(k,i){ var s=0.9+1.9*(c[k]-1)/Math.max(mx-1,1); h+='<span data-ukryj="'+esc(k)+'" style="font-size:'+s.toFixed(2)+'em;color:'+(c[k]===mx&&mx>1?"var(--czerwien2)":i%3?"var(--tusz)":"var(--szary)")+';font-weight:'+(c[k]===mx&&mx>1?500:300)+'">'+esc(czysc(k))+'</span>'; }); h+='</div>';
      } else {
        h+='<div class="sciana">'; t.forEach(function(x){ h+='<div class="kart'+(S.ukryte[norm(x)]?" ukr":"")+'" data-ukryj="'+esc(norm(x))+'" title="Kliknij, aby ukryć">'+esc(czysc(x))+'</div>'; }); h+='</div>';
      }
      return h;
    },
    sciaga:{czas:"5 min", powiedz:["Na koniec jedno pytanie, odpowiedź anonimowa, kilka słów. Nie ma złych odpowiedzi."],
      oczekuj:["Wybierz jedno z trzech pytań (przyciski u góry). Przy krótkich odpowiedziach („Niepodległość to dla mnie…”) dobrze działa widok „Chmura”.","Przeczytaj na głos kilka odpowiedzi. Bez debaty i bez oceniania."],
      uwagi:["Kliknięcie karteczki ukrywa ją (np. żart nie na miejscu). Wulgaryzmy są maskowane automatycznie.","„Zasłoń” chowa ścianę, gdy chcesz najpierw przejrzeć odpowiedzi.","Bez telefonów: karteczki samoprzylepne. Zbierz je i wpisz kilka w pole pod ścianą (pole widoczne przy otwartej ściądze)."]}
  },
  { id:"koniec", etap:"p", cur:function(){return {id:"koniec",typ:"koniec",tresc:"Dziękujemy za udział w lekcji."};},
    html:function(){ return fotoTlo("rozbrajanie")+'<div class="koniec"><div class="pas2"><i></i><i></i></div><div class="zd">'+esc(wariant().zamkniecie)+'</div><div class="daty">11 listopada 1918 · 11 listopada '+new Date().getFullYear()+'</div></div>'; },
    sciaga:{czas:"2 min", powiedz:[wariantZam], oczekuj:["Przeczytaj zdanie spokojnie, bez komentarza. To koniec lekcji."], uwagi:["Etap 4 i puenta nie mogą zniknąć: bez nich lekcja wychowawcza staje się lekcją historii."]}
  },
  { id:"modA", etap:"m", modul:"modA", cur:function(){return {id:"czekaj9",typ:"czekaj",tresc:"Moduł: Wiele twarzy niepodległości. Patrz na ekran."};},
    html:function(){ return etyk("Moduł A","Wiele twarzy niepodległości")+'<h2 class="ekran-tyt" style="margin-bottom:.7em">'+esc(T.pytanieModuluA)+'</h2><div id="dyn"></div>'; },
    dyn:function(){
      var h='<div class="postacie">';
      T.postacie.forEach(function(p,i){ h+='<button class="postac'+(S.postac===i?" akt":"")+'" data-postac="'+i+'"><img src="img/'+POSTAC_FOTO[i]+'.jpg" alt=""><h3>'+esc(p.imie)+'</h3><div class="lata">'+esc(p.lata)+'</div><p>'+esc(p.watek)+'</p></button>'; });
      h+='</div>';
      if(S.postac>=0){ var p=T.postacie[S.postac]; h+='<div class="bio-ekran ekran-in"><h3>'+esc(p.imie)+' <span class="mdl" style="font-weight:300">'+esc(p.lata)+'</span></h3><p class="mdl" style="margin:.2em 0 0;font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:.8em;color:var(--czerwien2)">'+esc(p.watek)+'</p><p style="margin:.5em 0;font-size:.92em">'+esc(p.bio)+'</p><p class="mdl" style="margin:0;font-size:.85em"><b style="color:var(--czerwien)">Pytanie dla grupy:</b> '+esc(p.pytanie)+'</p></div>'; }
      return h;
    },
    sciaga:{czas:"15–20 min (na drugą godzinę lub zamiast etapu 2)", powiedz:["Każda grupa dostaje jedną postać. Przeczytajcie biogram i odpowiedzcie: kim był(a), jakie miał(a) poglądy, jak przyczynił(a) się do niepodległości, z kim się spierał(a)."],
      oczekuj:["Grupy prezentują postać w 1 minutę. Na koniec pytanie: co ich różniło, a co mimo to połączyło?","Odpowiedź, do której warto dojść: różnili się prawie we wszystkim, ale łączyło ich to, że chcieli niepodległego państwa i dla niego pracowali."],
      uwagi:["Biogramy do druku są w materiałach (druk.html).","Kliknięcie postaci pokazuje jej biogram na ekranie."]}
  }
];
function wariantOtw(){ return "„"+wariant().otwarcie+"”"; }
function wariantZam(){ return "„"+wariant().zamkniecie+"”"; }

var EKR = [];
function zbuduj(){ EKR = EKR_WSZ.filter(function(e){ return !e.modul || S[e.modul]; }); if(S.idx>=EKR.length) S.idx=EKR.length-1; }
function liczGr(){ var l=T.karty.map(function(){return 0;}); S.grupy.wyb.slice(0,S.grupy.n).forEach(function(a){ a.forEach(function(i){ l[i]++; }); }); return l; }
function wartLinii(qid){
  var v=[]; var m=S.man[qid]||[]; [10,30,50,70,90].forEach(function(p,i){ for(var j=0;j<(m[i]||0);j++) v.push(p); });
  if(NA_ZYWO() && R[qid]) v=v.concat(R[qid].v.map(Number)); return v;
}
function tekstyRef(qid){
  var t=S.notatki.filter(function(n){return n.q===qid;}).map(function(n){return n.t;});
  if(NA_ZYWO() && R[qid]) t=t.concat(R[qid].v.map(String)); return t;
}
function curDla(e){ return e && e.cur ? e.cur() : {id:"czekaj",typ:"czekaj",tresc:"Patrz na ekran."}; }

/* ================= rysowanie ================= */
function rysuj(){
  zbuduj();
  var e=EKR[S.idx], el=$("#ekran");
  el.innerHTML=e.html(); el.classList.remove("ekran-in"); void el.offsetWidth; el.classList.add("ekran-in");
  odswiez(true);
  if(e.enter) e.enter();
  // pasek etapów
  var tu=e.etap, ix=ETAPY.findIndex(function(x){return x.id===tu;});
  $("#etapy").innerHTML=ETAPY.filter(function(x){ return x.id!=="m" || S.modA; }).map(function(x,i){
    var j=ETAPY.indexOf(x);
    return '<button class="'+(x.id===tu?"teraz":j<ix?"byl":"")+'" data-etap="'+x.id+'"><b>'+esc(x.nazwa)+'</b>'+(x.min?'<span>'+x.min+'′</span>':'')+'</button>';
  }).join("");
  $("#nr").textContent=(S.idx+1)+" / "+EKR.length;
  $("#wstecz").disabled = S.idx===0; $("#dalej").disabled = S.idx===EKR.length-1;
  $("#scena").scrollTop=0;
  rysujPanel();
  ustawCur(curDla(e));
  ustawPol(stanPol);
  var q=e.q&&e.q(); if(q) pobierz(q);
  tik();
}
function odswiez(){
  var e=EKR[S.idx], d=$("#dyn"); if(d && e.dyn) d.innerHTML=e.dyn();
}
function rysujPanel(){
  var e=EKR[S.idx], s=e.sciaga||{}, et=ETAPY.find(function(x){return x.id===e.etap;});
  function lista(a){ return (a||[]).map(function(x){ return '<li>'+esc(typeof x==="function"?x():x)+'</li>'; }).join(""); }
  var h='<h2>'+esc(et.nazwa)+'</h2><div class="czas">Ten ekran: '+esc(s.czas||"")+(et.min?' · cały etap: '+et.min+' min':'')+'</div>';
  if(et.min){ var n="etap"+et.id; if(!MIN[n]) minReset(n, et.min*60000);
    h+='<div class="tmr"><span class="t" data-min="'+n+'">'+mmss(minPoz(n))+'</span><button class="btn maly" data-minbtn="'+n+'">Start</button><button class="btn maly" data-minreset="'+n+'|'+et.min+'">Od nowa</button></div>'; }
  if(s.powiedz&&s.powiedz.length) h+='<h4>Co powiedzieć</h4>'+s.powiedz.map(function(x){ return '<div class="pow">'+esc(typeof x==="function"?x():x)+'</div>'; }).join("");
  if(s.oczekuj&&s.oczekuj.length) h+='<h4>Czego się spodziewać</h4><ul>'+lista(s.oczekuj)+'</ul>';
  if(s.uwagi&&s.uwagi.length) h+='<h4>Wskazówki</h4><ul>'+lista(s.uwagi)+'</ul>';
  if(e.id==="p1"||e.id==="p2"){ var P=e.id==="p1"?T.pytanie1:T.pytanie2; h+='<h4>Ściąga merytoryczna</h4><ul>'+lista(P.sciaga)+'</ul>'; }
  if(e.id==="refleksja" && NA_ZYWO()){ var t=tekstyRef("ref"+S.ref); h+='<h4>Odpowiedzi (podgląd tylko dla ciebie)</h4><ul>'+t.map(function(x){return '<li>'+esc(czysc(x))+'</li>';}).join("")+'</ul>'; }
  h+='<h4>Trudne pytania uczniów</h4>'+T.trudne.map(function(x){ return '<details><summary>'+esc(x.p)+'</summary><p>'+esc(x.o)+'</p></details>'; }).join("");
  h+='<p style="margin-top:1.4em;color:#9c9488;font-size:.85em">Przy otwartej ściądze widać przyciski + i − do ręcznego dopisywania głosów (np. uczniów bez telefonu).</p>';
  $("#panel").innerHTML=h; tik();
}

/* ================= nawigacja ================= */
function idz(i){ if(i<0||i>=EKR.length) return; S.idx=i; zapisz(); rysuj(); }
function dalej(){ var e=EKR[S.idx]; if(!S.start && S.idx===0){ S.start=Date.now(); } if(e.dalej && e.dalej()) return; idz(S.idx+1); }
function wstecz(){ idz(S.idx-1); }
function nakladka(html){ var n=$("#nakladka"); n.innerHTML='<button class="btn zamk" data-akcja="zamknij">Zamknij <kbd>Esc</kbd></button>'+html; n.classList.remove("ukryj"); }
function zamknijNak(){ $("#nakladka").classList.add("ukryj"); }
function pokazQR(){ if(!NA_ZYWO()){ toast("Głosowanie telefonami jest wyłączone (tryb ręczny)."); return; } nakladka('<div style="text-align:center">'+etyk("Dołącz do lekcji")+blokQR()+'</div>'); }
function pokazTrudne(){ nakladka('<div class="trudne">'+etyk("Ściąga","Trudne pytania uczniów")+'<h2 class="ekran-tyt" style="font-size:2em">Krótkie odpowiedzi do powiedzenia własnymi słowami</h2>'+T.trudne.map(function(x){ return '<details><summary>Uczeń: '+esc(x.p)+'</summary><p>'+esc(x.o)+'</p></details>'; }).join("")+'</div>'); }
function panel(){ $("#panel").classList.toggle("otw"); var e=EKR[S.idx]; if(e.dyn) odswiez(); if(e.id==="refleksja") rysuj(); }

document.addEventListener("click", function(ev){
  var b=ev.target.closest("[data-akcja],[data-plus],[data-odsl],[data-reset],[data-wariant],[data-mod],[data-tryb],[data-etap],[data-os],[data-gr],[data-ngr],[data-karta],[data-teza],[data-ref],[data-widok],[data-ukryj],[data-postac],[data-ust],[data-minbtn],[data-minreset]");
  if(!b) return;
  var d=b.dataset, a;
  if(d.akcja){ ev.preventDefault(); a=d.akcja;
    if(a==="zacznij"){ if(!S.start) S.start=Date.now(); idz(1); }
    else if(a==="panel") panel();
    else if(a==="qr") pokazQR();
    else if(a==="trudne") pokazTrudne();
    else if(a==="zamknij") zamknijNak();
    else if(a==="pelny") pelny();
    else if(a==="nowa"){ if(confirm("Rozpocząć lekcję z nową klasą? Wyniki poprzedniej klasy zostaną wyczyszczone.")){ var w=S.wariant,mA=S.modA,mB=S.modB,rc=S.reczny; S=domyslny(); S.wariant=w; S.modA=mA; S.modB=mB; S.reczny=rc; R={}; MIN={}; ostatniCur=null; zapisz(); rysuj(); toast("Nowa klasa, kod "+S.kod); } }
    else if(a==="czyscgr"){ S.grupy.wyb=[]; zapisz(); odswiez(); }
    else if(a==="zakryjwsz"){ S.odwr={}; S.karta=-1; zapisz(); odswiez(); }
    else if(a==="zaslona"){ S.zaslona=!S.zaslona; zapisz(); odswiez(); }
    else if(a==="dodajnot") dodajNot();
    return; }
  if(d.plus){ var p=d.plus.split("|"); plus(p[0],+p[1],+p[2],+p[3]); return; }
  if(d.odsl){ p=d.odsl.split("|"); S.odsl[p[0]]=+p[1]; zapisz(); var e=EKR[S.idx]; e.dyn?odswiez():rysuj(); return; }
  if(d.reset){ if(!confirm("Wyczyścić głosy przy tym pytaniu?")) return; S.man[d.reset]=[]; S.odsl[d.reset]=0; S.notatki=S.notatki.filter(function(n){return n.q!==d.reset;}); delete R[d.reset]; if(NA_ZYWO()) post({akcja:"reset",q:d.reset}); zapisz(); odswiez(); return; }
  if(d.wariant){ S.wariant=d.wariant; zapisz(); rysuj(); return; }
  if(d.mod){ S[d.mod]=!S[d.mod]; zapisz(); rysuj(); return; }
  if(d.tryb){ S.reczny = d.tryb==="rek"; ostatniCur=null; zapisz(); rysuj(); return; }
  if(d.etap){ var i=EKR.findIndex(function(x){return x.etap===d.etap;}); if(i>=0) idz(i); return; }
  if(d.os){ S.os=+d.os; S.osWid[S.os]=1; zapisz(); odswiez(); return; }
  if(d.gr){ p=d.gr.split("|"); var g=S.grupy.wyb[+p[0]]||(S.grupy.wyb[+p[0]]=[]), k=+p[1], j=g.indexOf(k); if(j>=0) g.splice(j,1); else { if(g.length>=3){ toast("Grupa ma tylko 3 żetony."); return; } g.push(k); } zapisz(); odswiez(); return; }
  if(d.ngr){ S.grupy.n=+d.ngr; zapisz(); odswiez(); return; }
  if(d.karta){ S.karta=+d.karta; S.odwr[S.karta]=1; zapisz(); odswiez(); return; }
  if(d.teza){ S.teza=+d.teza; zapisz(); rysuj(); return; }
  if(d.ref){ S.ref=+d.ref; zapisz(); rysuj(); return; }
  if(d.widok){ S.widok=d.widok; zapisz(); odswiez(); return; }
  if(d.ukryj!==undefined){ S.ukryte[d.ukryj]=!S.ukryte[d.ukryj]; zapisz(); odswiez(); rysujPanelJesli(); return; }
  if(d.postac){ S.postac=S.postac===+d.postac?-1:+d.postac; zapisz(); odswiez(); return; }
  if(d.ust){ p=d.ust.split("|"); minReset(p[0],+p[1]*60000); return; }
  if(d.minbtn){ var m=MIN[d.minbtn]; if(m&&m.run) minPauza(d.minbtn); else minStart(d.minbtn); return; }
  if(d.minreset){ p=d.minreset.split("|"); minReset(p[0],+p[1]*60000); return; }
});
function rysujPanelJesli(){ if($("#panel").classList.contains("otw")) rysujPanel(); }
function dodajNot(){ var i=$("#nowaNot"); if(!i||!i.value.trim()) return; S.notatki.push({q:"ref"+S.ref,t:i.value.trim().slice(0,90)}); i.value=""; zapisz(); odswiez(); i.focus(); }
function pelny(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen(); }

document.addEventListener("keydown", function(ev){
  if(ev.target.tagName==="INPUT"){ if(ev.key==="Enter") dodajNot(); return; }
  var k=ev.key;
  if(!$("#nakladka").classList.contains("ukryj")){ if(k==="Escape"||k==="q"||k==="Q"||k==="t"||k==="T") zamknijNak(); return; }
  if(k==="ArrowRight"||k===" "||k==="PageDown"){ ev.preventDefault(); dalej(); }
  else if(k==="ArrowLeft"||k==="PageUp"){ ev.preventDefault(); wstecz(); }
  else if(k==="n"||k==="N") panel();
  else if(k==="q"||k==="Q") pokazQR();
  else if(k==="t"||k==="T") pokazTrudne();
  else if(k==="f"||k==="F") pelny();
  else if(k==="Escape") $("#panel").classList.remove("otw");
});
$("#dalej").onclick=dalej; $("#wstecz").onclick=wstecz;

/* odśwież ściągę z podglądem odpowiedzi */
setInterval(function(){ var e=EKR[S.idx]; if(e.id==="refleksja" && $("#panel").classList.contains("otw")) rysujPanel(); }, 5000);

(function(){ var m=location.hash.match(/^#e=(\w+)/); if(m){ zbuduj(); var i=EKR.findIndex(function(x){return x.id===m[1];}); if(i<0){ var e=EKR_WSZ.find(function(x){return x.id===m[1];}); if(e&&e.modul){ S[e.modul]=true; zbuduj(); i=EKR.findIndex(function(x){return x.id===m[1];}); } } if(i>=0) S.idx=i; } })();
rysuj();
if(NA_ZYWO()) fetch(ADRES).then(function(r){return r.json();}).then(function(){ustawPol("ok");}).catch(function(){ustawPol("blad");});
})();
</script>
