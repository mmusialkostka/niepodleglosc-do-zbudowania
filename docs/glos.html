<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2e9">
<title>Niepodległość do zbudowania · głosowanie</title>
<link rel="stylesheet" href="fonts/fonty.css">
<style>
:root{--tlo:#f6f2e9;--papier:#fffdf8;--tusz:#23211e;--szary:#6c665c;--linia:#e2dacb;--linia2:#d3c9b5;--czerwien:#a3171f;--zielen:#2f6b4f;--zielenTlo:#e3efe7;
  --serif:"Lora",Georgia,serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--tlo);color:var(--tusz);font-family:var(--sans);font-size:17px;line-height:1.45}
button,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--linia)}
header .pas{width:22px;height:15px;display:flex;flex-direction:column;border:1px solid var(--linia2)}
header .pas i{flex:1;background:#fff}header .pas i+i{background:var(--czerwien)}
header b{font-family:var(--serif);font-weight:600}
header span{margin-left:auto;font-size:.8em;color:var(--szary)}
main{padding:20px 16px 40px;max-width:560px;margin:0 auto}
h1{font-family:var(--serif);font-weight:600;font-size:1.35em;line-height:1.3;margin:0 0 18px}
.etyk{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--czerwien);font-weight:600;margin-bottom:8px}
.czekaj{text-align:center;padding:48px 8px;color:var(--szary)}
.czekaj .k{width:12px;height:12px;border-radius:50%;background:var(--czerwien);margin:0 auto 18px;animation:p 1.6s infinite}
@keyframes p{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.opc{display:flex;flex-direction:column;gap:10px}
.opc button{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:left;background:var(--papier);border:1.5px solid var(--linia2);border-radius:12px;padding:14px;min-height:56px}
.opc button b{font-family:var(--serif);color:var(--czerwien);font-size:1.15em}
.opc button.wyb{border-color:var(--tusz);background:var(--tusz);color:#fff}
.opc button.wyb b{color:#fff}
.ok{margin-top:16px;background:var(--zielenTlo);color:var(--zielen);border-radius:10px;padding:10px 14px;font-size:.9em}
.blad{margin-top:16px;background:#f6e4e2;color:var(--czerwien);border-radius:10px;padding:10px 14px;font-size:.9em}
.suwak{margin:28px 4px 8px}
input[type=range]{width:100%;height:36px;accent-color:var(--czerwien)}
.krance{display:flex;justify-content:space-between;font-size:.78em;color:var(--szary);gap:16px}
.krance span:last-child{text-align:right}
.wart{text-align:center;font-family:var(--serif);font-size:1.1em;margin:14px 0 4px;min-height:1.5em}
.wyslij{width:100%;margin-top:18px;background:var(--czerwien);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:600;font-size:1em}
.wyslij[disabled]{opacity:.5}
textarea,.kod input{width:100%;border:1.5px solid var(--linia2);border-radius:12px;padding:12px 14px;background:var(--papier);font-size:1.05em;resize:none}
.licz{font-size:.75em;color:var(--szary);text-align:right;margin-top:4px}
.kod input{text-transform:uppercase;letter-spacing:.2em;text-align:center;font-family:var(--serif);font-size:1.5em}
.mdl{color:var(--szary);font-size:.9em}
footer{text-align:center;font-size:.72em;color:var(--szary);padding:0 16px 24px}
</style>
</head>
<body>
<header><span class="pas"><i></i><i></i></span><b>Niepodległość do zbudowania</b><span id="kodKl"></span></header>
<main id="m"><div class="czekaj"><div class="k"></div>Łączenie…</div></main>
<footer>Głosowanie jest anonimowe. Nie zbieramy imion ani danych osobowych.</footer>
<script src="ustawienia.js"></script>
<script>
(function(){
"use strict";
var ADRES=((window.USTAWIENIA||{}).ADRES||"").trim();
var m=document.getElementById("m");
var kod=(new URLSearchParams(location.search).get("s")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
var u; try{ u=localStorage.getItem("ndz-u"); if(!u){ u=Math.random().toString(36).slice(2,12)+Date.now().toString(36).slice(-4); localStorage.setItem("ndz-u",u);} }catch(e){ u=Math.random().toString(36).slice(2,14); }
var odp={}; try{ odp=JSON.parse(sessionStorage.getItem("ndz-odp-"+kod))||{}; }catch(e){}
function zap(){ try{ sessionStorage.setItem("ndz-odp-"+kod, JSON.stringify(odp)); }catch(e){} }
var cur=null, curKlucz="", wysylam=false, komunikat="";
function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

if(!ADRES){ m.innerHTML='<div class="czekaj">Głosowanie telefonami nie jest włączone dla tej lekcji. Patrz na ekran i głosuj podniesieniem ręki.</div>'; return; }
if(!kod){ pokazKod(); return; }
document.getElementById("kodKl").textContent="klasa "+kod;

function pokazKod(){
  m.innerHTML='<div class="etyk">Dołącz do lekcji</div><h1>Wpisz kod klasy widoczny na ekranie</h1><form class="kod" id="f"><input id="k" maxlength="8" autocomplete="off" autocapitalize="characters" inputmode="text"><button class="wyslij">Dołącz</button></form>';
  document.getElementById("f").onsubmit=function(e){ e.preventDefault(); var v=document.getElementById("k").value.toUpperCase().replace(/[^A-Z0-9]/g,""); if(v.length>=4) location.search="?s="+v; };
}

function rysuj(){
  var c=cur;
  if(!c || c.typ==="czekaj"){ m.innerHTML='<div class="czekaj"><div class="k"></div>'+esc(c&&c.tresc||"Czekaj na pytanie. Patrz na ekran.")+'</div>'; return; }
  if(c.typ==="koniec"){ m.innerHTML='<div class="czekaj" style="color:var(--tusz)"><h1>'+esc(c.tresc)+'</h1><p class="mdl">Możesz zamknąć tę stronę.</p></div>'; return; }
  var a=odp[c.id], h='';
  if(c.typ==="wybor"){
    h='<div class="etyk">Głosowanie</div><h1>'+esc(c.tresc)+'</h1><div class="opc">';
    c.opcje.forEach(function(t,i){ h+='<button data-v="'+i+'" class="'+(a===i?"wyb":"")+'"><b>'+"ABCDEFGH"[i]+'</b><span>'+esc(t)+'</span></button>'; });
    h+='</div>'+(a!==undefined?'<div class="ok">Głos oddany. Możesz go jeszcze zmienić.</div>':'');
  } else if(c.typ==="linia"){
    var v=a!==undefined?a:50;
    h='<div class="etyk">Linia wartości</div><h1>„'+esc(c.tresc)+'”</h1><div class="suwak"><input type="range" id="r" min="0" max="100" value="'+v+'"></div><div class="krance"><span>← '+esc(c.lewo)+'</span><span>'+esc(c.prawo)+' →</span></div><div class="wart" id="w">'+opis(v)+'</div><button class="wyslij" id="send">'+(a!==undefined?"Zmień ustawienie":"Ustaw się na linii")+'</button>'+(a!==undefined?'<div class="ok">Twoje miejsce na linii jest na ekranie (anonimowo).</div>':'');
  } else if(c.typ==="tekst"){
    h='<div class="etyk">Twoja odpowiedź · anonimowo</div><h1>'+esc(c.tresc)+'</h1><textarea id="t" rows="3" maxlength="90" placeholder="Kilka słów…">'+esc(a||"")+'</textarea><div class="licz" id="lz">'+(a||"").length+'/90</div><button class="wyslij" id="send">'+(a?"Popraw odpowiedź":"Wyślij")+'</button>'+(a?'<div class="ok">Wysłano. Twoja odpowiedź pojawi się na ekranie bez podpisu.</div>':'');
  }
  if(komunikat) h+='<div class="blad">'+esc(komunikat)+'</div>';
  m.innerHTML=h;
  var r=document.getElementById("r"); if(r) r.oninput=function(){ document.getElementById("w").textContent=opis(+r.value); };
  var t=document.getElementById("t"); if(t) t.oninput=function(){ document.getElementById("lz").textContent=t.value.length+"/90"; };
  var s=document.getElementById("send"); if(s) s.onclick=function(){ if(c.typ==="linia") glos(+r.value); else { var x=t.value.replace(/\s+/g," ").trim(); if(x) glos(x); } };
}
function opis(v){ return v<15?"zdecydowanie się nie zgadzam":v<40?"raczej się nie zgadzam":v<=60?"trudno powiedzieć":v<=85?"raczej się zgadzam":"zdecydowanie się zgadzam"; }

m.addEventListener("click",function(e){ var b=e.target.closest("[data-v]"); if(b&&cur&&cur.typ==="wybor") glos(+b.getAttribute("data-v")); });

function glos(v){
  if(wysylam) return; wysylam=true; komunikat="";
  var id=cur.id; var stare=odp[id]; odp[id]=v; rysuj();
  fetch(ADRES,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({akcja:"glos",s:kod,q:id,u:u,v:v})})
    .then(function(r){return r.json();}).then(function(j){
      wysylam=false;
      if(!j.ok){ odp[id]=stare; komunikat = j.blad==="zamkniete" ? "To pytanie jest już zamknięte." : j.blad==="zajete" ? "Dużo osób głosuje naraz. Spróbuj za chwilę." : "Nie udało się wysłać. Spróbuj jeszcze raz."; }
      zap(); rysuj();
    }).catch(function(){ wysylam=false; odp[id]=stare; komunikat="Brak połączenia. Spróbuj jeszcze raz."; rysuj(); });
}

function sprawdz(){
  if(document.visibilityState!=="visible"){ plan(4000); return; }
  fetch(ADRES+"?co=stan&s="+kod+"&_="+Date.now()).then(function(r){return r.json();}).then(function(j){
    var c=j.cur||null, k=JSON.stringify(c&&{id:c.id,typ:c.typ,tresc:c.tresc,opcje:c.opcje});
    if(k!==curKlucz){ var aktywne=document.activeElement; var pisze=aktywne&&(aktywne.id==="t"||aktywne.id==="r"); if(!(pisze && cur && c && cur.id===c.id)){ cur=c; curKlucz=k; komunikat=""; rysuj(); } }
    plan(3000);
  }).catch(function(){ plan(5000); });
}
var tm; function plan(ms){ clearTimeout(tm); tm=setTimeout(sprawdz, ms + Math.random()*1200); }
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") plan(0); });
sprawdz();
})();
</script>
</body>
</html>
